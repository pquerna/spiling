name: Opt-in native packaging
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native packaging evidence (all spends three platform builds)
        type: choice
        default: linux
        options: [linux, macos, windows, all]
permissions:
  contents: read
concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'all' && '["ubuntu-24.04","macos-14","windows-2022"]' || inputs.platform == 'macos' && '["macos-14"]' || inputs.platform == 'windows' && '["windows-2022"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
      - name: Install pinned tools
        run: |
          npm install --global pnpm@10.32.1
          rustup toolchain install 1.99.0 --profile minimal
      - name: Restore dependency downloads only
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: package-downloads-${{ runner.os }}-rust-1.99.0-${{ hashFiles('Cargo.lock') }}
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config cmake ninja-build libssl-dev libx11-dev libxkbcommon-dev libwayland-dev libvulkan1 desktop-file-utils dpkg-dev
      - run: pnpm install --frozen-lockfile
      - name: Check contract drift before packaging
        run: pnpm contracts --check
      - name: Build release once and bundle selected platform
        run: pnpm package
      - name: Upload development package and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spiling-b0-${{ runner.os }}
          path: |
            target/release/bundle/
            .cache/release/provenance.json
          if-no-files-found: error
          retention-days: 3

# Automatic remote CI is disabled; run checks locally via pnpm check && pnpm test.
# Native packaging runs only by explicit workflow dispatch.
# Packaging does not establish physical GPU support or signed release acceptance.
