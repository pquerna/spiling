name: B0 build and protocol acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
      - name: Install pnpm
        run: npm install --global pnpm@10.32.1
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libx11-dev libxrandr-dev libxcomposite-dev libxdamage-dev libnss3-dev libasound2-dev libgbm-dev libsecret-1-dev libssl-dev patchelf desktop-file-utils xvfb xauth dbus-x11
      - name: Bootstrap actual CEF runtime
        run: pnpm bootstrap
      - name: Check contracts and source
        run: pnpm check
      - name: Exercise protocol and actual engine
        run: pnpm test
      - name: Build platform distributable
        run: pnpm package
      - name: Upload package and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spiling-b0-${{ runner.os }}
          path: |
            target/release/bundle/
            .cache/release/provenance.json
          if-no-files-found: error

# Packaged WebGPU on physical reference hardware is a separate acceptance gate.
# CI build success must not be advertised as a hardware support certification.
