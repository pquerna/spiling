[[changes]]
paths = ["src/predicate.rs", "src/predicate/lazy_circle_formation.rs", "src/predicate/tests.rs"]
reason = "Evaluate signed cross products in i128 before conversion to f64 so admitted i32-coordinate differences cannot overflow i64 products or lose cancellation signs. Reject point-point-segment triples with no finite tangent circle before divisions, and point-segment-segment events with negative discriminants before square roots. No epsilon or coordinate perturbation is used. Preserve valid zero-discriminant tangency, a point on the line, one-grid separation and envelope-scale finite circles."

[[changes]]
paths = ["Cargo.toml"]
reason = "Standalone published Cargo.toml.orig dependencies and features; omit unvendored GUI examples/benchmarks and their dev dependencies. Preserve runtime sources, original manifest, license and README."
