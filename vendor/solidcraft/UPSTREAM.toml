repository = "https://github.com/tangency-labs/solidcraft"
base_revision = "1b7b9d8d88233c18071fe8d6f4da418a315935a6"
snapshot_revision = "db09423bd4efac448d1a5fc79592da1d596be2d8"
version = "0.18.1"
license = "MIT OR Apache-2.0"
crates = ["solidcraft-geom", "solidcraft-step"]
regression_inputs = "tests/step-conformance"

[[changes]]
path = "crates/geom/src/tess/uv.rs"
revision = "db09423bd4efac448d1a5fc79592da1d596be2d8"
reason = "Recognize complete closed spline boundary rows related by one exact positive homogeneous scale; retain rejection of unequal row laws, unsafe products and changed geometry."

[[changes]]
paths = ["crates/geom/Cargo.toml", "crates/step/Cargo.toml"]
reason = "Make upstream package metadata, dependencies and lints standalone without inheriting Spiling's license or requiring the SolidCraft application workspace."

[[changes]]
paths = ["crates/geom/LICENSE-MIT", "crates/geom/LICENSE-APACHE", "crates/geom/NOTICE", "crates/step/LICENSE-MIT", "crates/step/LICENSE-APACHE", "crates/step/NOTICE"]
reason = "Retain unmodified upstream notices alongside each crate for release collection."

[[changes]]
paths = ["crates/step/src/topology.rs", "crates/step/src/topology/charts.rs", "crates/step/src/topology/seams.rs"]
reason = "Propose a unique source-associated spline PCURVE only on its identical retained carrier and gauge. Construct rounding-close native chart boundaries and common original-vertex endpoints before completed BREP geometry validation; preserve genuine exterior controls and distinct pole/seam branches. Original STEP operands remain unchanged and native consumers retain independent whole-curve/containment checks."

[[changes]]
paths = ["crates/geom/src/brep/pcurve.rs", "crates/geom/src/brep/pcurve_tests.rs"]
reason = "Solve generated cubic PCURVE least squares in displacement coordinates with literal fixed endpoints. Preserve exactly constant nonzero chart coordinates without absolute-coordinate cancellation; retain existing lifting checks, real variation and unchanged supplied PCURVEs."

[[changes]]
paths = ["crates/step/src/topology.rs", "crates/step/src/topology_tests.rs"]
reason = "Clamp loop-area sample parameters to each pcurve's interval. Traversing a use backwards computed b - (b - a), which rounds one ulp below a for some intervals; the pcurve refused it, the loop lost its area, a hole was taken as the outer loop and its face was turned over."

[[changes]]
paths = ["crates/step/src/topology.rs", "crates/step/src/topology/seams.rs", "crates/step/src/topology_tests.rs"]
reason = "A circle or ellipse edge between distinct vertices within the tolerance is read as a full turn, as before, but keeps the arc between its vertices' angles as its other reading. A periodic face whose loops cannot bound it with the full-turn reading (an Inventor 0.001 mm arc under a 0.01 mm uncertainty made a cylinder band wind twice) takes the arc reading when its loops then close, recorded in the solid's notes; otherwise the face refuses as before."

[[changes]]
paths = ["crates/step/src/topology.rs", "crates/step/src/topology/seams.rs", "crates/step/src/topology/splits.rs", "crates/step/src/topology_tests.rs"]
reason = "Two faces on equal surface records sharing one edge, each bounded by a loop that winds once around an open periodic surface while together they wind nowhere (an Inventor thread root band split along a straight ruling off the band), keep their loops, edges and vertices; the shared edge is laid again inside their union on the surface (along its corners' bisectors, then straight in (u, v)), checked inside the union and within half the tolerance, and recorded in the solid's notes. Any other single winding loop on an open surface still refuses."

[[changes]]
paths = ["crates/step/src/topology.rs"]
reason = "A torus face's loop going all the way around the torus that starts on the seam at the high end of the face's turn starts instead at a use inside the turn (or, when every use starts on the seam, at its low end). The pinned SolidCore gives torus faces no UV trims, so its mesher maps such a loop by point inversion from its start, where a seam point reads as the low end, and the loop ran out of its chart. Other faces keep their loop order."

[[changes]]
paths = ["crates/geom/src/brep/pcurve.rs", "crates/step/src/topology_tests.rs"]
reason = "After each loop is closed into the base period, move every loop of a face by whole periods to sit over the face's widest loop: a hole beside an outer loop whose seam is not at the surface's zero landed a period away, outside its face's domain."

[[changes]]
paths = ["crates/geom/src/brep.rs", "crates/geom/src/brep/eval.rs", "crates/geom/src/brep/tests.rs", "crates/step/src/topology/swept.rs", "crates/step/src/topology_tests.rs"]
reason = "Admit horn and spindle tori, and DEGENERATE_TOROIDAL_SURFACE's outer sheet, as OCCT's Geom_ToroidalSurface does; a torus offset past its axis keeps its parameters. Refuse by name a face whose boundary lies on a spindle's inner (lemon) sheet, where STEP's out-of-tube normal and the parametric normal disagree. Projection at a horn or spindle apex on the axis keeps the nearby angle, as on the axis itself, instead of the angle of rounding noise."
