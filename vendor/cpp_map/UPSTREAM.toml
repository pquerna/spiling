[[changes]]
paths = ["src/skiplist.rs", "src/skiplist/skiplist_impl.rs", "src/skiplist/insert.rs", "src/skiplist/extend.rs"]
reason = "Draw skip-list node levels from a fixed-seed generator owned by each list instead of a thread-local OS-seeded rand::ThreadRng. boostvoronoi's beach-line comparator is not a strict total order on degenerate inputs, so the random tower heights changed which keys a search probed and the constructed segment-Voronoi diagram differed between runs of one input."

[[changes]]
paths = ["Cargo.toml"]
reason = "Standalone manifest from the published Cargo.toml.orig: drop the now-unused rand runtime dependency, the release profile and the example and integration-test targets that are not vendored."
