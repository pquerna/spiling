[package]
name = "cpp_map"
description = "A simple C++ std::map emulator"
version = "0.2.0"
authors = ["eadf"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.87.0"
readme = "README.md"
repository = "https://codeberg.org/eadf/cpp_map_rs"
keywords = ["cpp", "map"]

[features]
# used for debugging purposes
console_debug = []
# enable the midpoint calculation for the LinkedList
linkedlist_midpoint = []

[dependencies]
thiserror = "2.0.17"
smallvec = "1.15.0"

[dev-dependencies]
rand = "0.9.1"
