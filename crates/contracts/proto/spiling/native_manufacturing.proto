syntax = "proto3";
package spiling.engine;

import "google/longrunning/operations.proto";
import "spiling/native_common.proto";
import "spiling/native_project.proto";

service Manufacturing {
  rpc Execute(ManufacturingRequest) returns (ManufacturingReply);
  rpc Preflight(PreflightManufacturingRequest) returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      response_type: "NativeOperationResult"
      metadata_type: "NativeOperationMetadata"
    };
  }
  rpc Compile(CompileManufacturingRequest) returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      response_type: "NativeOperationResult"
      metadata_type: "NativeOperationMetadata"
    };
  }
  rpc Verify(VerifyManufacturingRequest) returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      response_type: "NativeOperationResult"
      metadata_type: "NativeOperationMetadata"
    };
  }
}

message ManufacturingRequest {
  string parent = 1; // sessions/{session_uuid}
  oneof command {
    GetManufacturingRequest get = 2;
    SetManufacturingIntentRequest set_intent = 3;
  }
}
message GetManufacturingRequest {}
message SetManufacturingIntentRequest {
  uint32 base_revision = 1; // Project revision, not scene publication revision.
  ManufacturingIntent intent = 2;
}
message CompileManufacturingRequest {
  string parent = 1;
  string request_id = 2; // Optional canonical nonnil UUID.
  uint32 base_revision = 3;
}
message PreflightManufacturingRequest {
  string parent = 1;
  string request_id = 2;
  uint32 base_revision = 3;
}
enum PreflightSeverity {
  PREFLIGHT_SEVERITY_UNSPECIFIED = 0;
  PREFLIGHT_ERROR = 1;
  PREFLIGHT_WARNING = 2;
  PREFLIGHT_INFO = 3;
}
enum PreflightDisposition {
  PREFLIGHT_DISPOSITION_UNSPECIFIED = 0;
  PREFLIGHT_ADMITTED = 1;
  PREFLIGHT_REFUSED = 2;
  PREFLIGHT_UNRESOLVED = 3;
}
enum PreflightEvidence {
  PREFLIGHT_EVIDENCE_UNSPECIFIED = 0;
  PREFLIGHT_NOT_EVALUATED = 1;
  PREFLIGHT_CERTIFIED = 2;
  PREFLIGHT_UNSUPPORTED = 3;
  PREFLIGHT_INDETERMINATE = 4;
  PREFLIGHT_FAILED = 5;
}
message PreflightCheck {
  string code = 1;
  PreflightSeverity severity = 2;
  string message = 3;
  optional uint32 occurrence_id = 4;
  optional string face_id = 5;
  PreflightEvidence evidence = 6;
  optional bool required = 7;
}
message PreflightReport {
  uint32 input_revision = 1;
  PreflightDisposition disposition = 2;
  bool software_only = 3;
  repeated PreflightCheck checks = 4;
}
message ManufacturingPreflightResult {
  PreflightReport report = 1;
}
message VerifyManufacturingRequest {
  string parent = 1;
  string request_id = 2;
  uint32 base_revision = 3;
  VerificationOutput output = 4;
}
// Domain failures use canonical Google Status, never a success reply arm.
message ManufacturingReply {
  ManufacturingStatus status = 1;
}
message ManufacturingStatus {
  ProjectInfo info = 1;
  ManufacturingIntent intent = 2;
  ManufacturingArtifactRecord artifact = 3;
  Artifact resource = 4;
}
message ManufacturingCompiledResult {
  ProjectInfo info = 1;
  ManufacturingArtifactRecord record = 2;
  Artifact resource = 3;
}
message ManufacturingVerifiedResult {
  ManufacturingArtifactRecord record = 1;
  VerificationReport report = 2;
  Artifact resource = 3;
  ManufacturingInspectionProvenance provenance = 4;
  ReplayDisplayDescriptor replay_display = 5;
}

enum VerificationOutput {
  VERIFICATION_OUTPUT_UNSPECIFIED = 0;
  REPORT_ONLY = 1;
  REPORT_AND_MOTION = 2;
}
message ManufacturingInspectionProvenance {
  string project_id = 1;
  uint32 input_revision = 2;
  string input_hash = 3;
  KernelIdentity kernel = 4;
  string planner_version = 5;
  string emitter_version = 6;
  string verifier_version = 7;
  SurfaceOverlays surface_overlays = 8;
  ProcessDocument process_document = 9;
}
message ReplayDisplayInfo {
  uint32 schema_version = 1;
  string bundle_hash = 2;
  string input_hash = 3;
  string program_hash = 4;
  string verifier_version = 5;
  PrinterCoordinateFrame frame = 6;
  uint32 event_count = 7;
  uint32 deposition_count = 8;
  uint32 travel_count = 9;
  uint32 layer_count = 10;
  AabbMm bounds_mm = 11;
  uint32 lifecycle_count = 12;
  uint32 process_count = 13;
}
message ReplayDisplayDescriptor {
  ReplayDisplayInfo info = 1;
  Artifact resource = 2;
}

message ManufacturingIntent {
  PrinterSpecification printer = 1;
  PlanarPrintRecipe recipe = 2;
}
enum PrinterCoordinateFrame {
  PRINTER_COORDINATE_FRAME_UNSPECIFIED = 0;
  RIGHT_HANDED_MILLIMETRES = 1;
}
enum MotionSpace {
  MOTION_SPACE_UNSPECIFIED = 0;
  CARTESIAN_XYZ = 1;
}
enum OutputDialect {
  OUTPUT_DIALECT_UNSPECIFIED = 0;
  CARTESIAN_ABSOLUTE_GCODE_V1 = 1;
  MARLIN2_SINGLE_EXTRUDER_GCODE_V1 = 2;
}
message PrinterCapabilities {
  MotionSpace motion_space = 1;
  uint32 extruders = 2;
  OutputDialect output_dialect = 3;
  bool generated_supports = 4;
}
enum MachineComponentRole {
  MACHINE_COMPONENT_ROLE_UNSPECIFIED = 0;
  BED = 1;
  TOOLHEAD = 2;
  FIXTURE = 3;
}
message CylinderComponentShape {
  double radius_mm = 1;
  double height_mm = 2;
}
message MachineComponentShape {
  oneof shape {
    AabbMm box = 1;
    CylinderComponentShape cylinder = 2;
  }
}
message MachineComponent {
  string id = 1;
  MachineComponentRole role = 2;
  RigidPoseMm pose = 3;
  MachineComponentShape shape = 4;
}
message PrinterSpecification {
  uint32 schema_version = 1;
  string id = 2;
  string revision = 3;
  string name = 4;
  PrinterCoordinateFrame coordinate_frame = 5;
  AabbMm build_envelope = 6;
  repeated MachineComponent components = 7;
  PrinterCapabilities capabilities = 8;
  double nozzle_diameter_mm = 9;
  double max_feed_mm_s = 10;
  double max_volumetric_flow_mm3_s = 11;
  JobWorkflow workflow = 12;
}
message DiagnosticBodyOnly {}
enum HomingCoordinateContract {
  HOMING_COORDINATE_CONTRACT_UNSPECIFIED = 0;
  MARLIN_NATIVE_CARTESIAN = 1;
}
message JobWorkflow {
  oneof workflow {
    DiagnosticBodyOnly diagnostic_body_only = 1;
    SingleExtruderJob complete_marlin = 2;
  }
}
message SingleExtruderJob {
  string machine_id = 1;
  string firmware_version = 2;
  string configuration_hash = 3;
  string calibration_record_hash = 4;
  HomingCoordinateContract homing_contract = 5;
  Vec3 home_position_mm = 6;
  // Temperature targets/limits are finite positive integral Celsius degrees.
  // Complete configuration must compile TEMPERATURE_UNITS_SUPPORT (M149 C).
  double nozzle_temperature_c = 7;
  double bed_temperature_c = 8;
  double minimum_extrusion_temperature_c = 9;
  double maximum_nozzle_temperature_c = 10;
  double maximum_bed_temperature_c = 11;
  // Complete prime segment excludes the conservative whole-object XY bounds
  // plus half bead width and serialization padding, irrespective of Z/holes.
  Vec3 prime_start_mm = 12;
  Vec3 prime_end_mm = 13;
  double prime_filament_length_mm = 14;
  double prime_speed_mm_s = 15;
  Vec3 park_position_mm = 16;
}
message PlanarPrintRecipe {
  string id = 1;
  string revision = 2;
  string material_id = 3;
  string material_revision = 4;
  double filament_diameter_mm = 5;
  double layer_height_mm = 6;
  double bead_width_mm = 7;
  uint32 perimeter_count = 8;
  double infill_fraction = 9;
  double print_speed_mm_s = 10;
  double travel_speed_mm_s = 11;
  double flow_multiplier = 12;
  double top_skin_thickness_mm = 13;
  double bottom_skin_thickness_mm = 14;
  ProcessPolicy process = 15;
  SupportPolicy supports = 16;
  double native_shape_error_mm = 17;
  SeamPolicy seam_policy = 18;
  RectilinearAxisPolicy rectilinear_axis = 19;
}
message NearestSeam {}
message PreferredBuildDirectionSeam {
  // Finite normalized unit vector in build/machine XY, not source or camera XY.
  double x = 1;
  double y = 2;
}
message SeamPolicy {
  oneof policy {
    NearestSeam nearest = 1;
    PreferredBuildDirectionSeam preferred_build_direction = 2;
  }
}
enum RectilinearAxisPolicy {
  RECTILINEAR_AXIS_POLICY_UNSPECIFIED = 0;
  RECTILINEAR_X = 1;
  RECTILINEAR_Y = 2;
  ALTERNATING_XY = 3;
  ALTERNATING_YX = 4;
}
message RetractionDisabled {}
message RetractionEnabled {
  double distance_mm = 1;
  double speed_mm_s = 2;
  double minimum_travel_mm = 3;
  double z_hop_mm = 4;
}
message RetractionPolicy {
  oneof policy {
    RetractionDisabled disabled = 1;
    RetractionEnabled enabled = 2;
  }
}
message ProcessPolicy {
  double first_layer_speed_factor = 1;
  double first_layer_flow_factor = 2;
  uint32 fan_first_layers = 3;
  uint32 fan_after_first_layers = 4;
  double bridge_speed_factor = 5;
  double bridge_flow_factor = 6;
  uint32 bridge_fan_pwm = 7;
  double max_bridge_span_mm = 8;
  RetractionPolicy retraction = 9;
}
message SupportsDisabled {}
message BreakawaySupports {
  double density = 1;
  double xy_clearance_mm = 2;
  double z_gap_mm = 3;
  double interface_thickness_mm = 4;
}
message SupportPolicy {
  oneof policy {
    SupportsDisabled disabled = 1;
    BreakawaySupports breakaway = 2;
  }
}
message ManufacturingArtifactRecord {
  string hash = 1;
  string input_hash = 2;
  uint32 byte_count = 3;
  ManufacturingSummary summary = 4;
}
enum SkinCoverageScope {
  SKIN_COVERAGE_SCOPE_UNSPECIFIED = 0;
  SCHEDULED_MATERIAL_DISTANCE = 1;
}
enum SupportClearanceScope {
  SUPPORT_CLEARANCE_SCOPE_UNSPECIFIED = 0;
  CONTINUOUS_TARGET_OUTER_OCCUPANCY = 1;
}
// Accepted scheduled-layer partition and explicit original-occurrence endpoint ownership.
message NativeFeatureCoverageSummary {
  optional uint32 disjoint_source_layer_count = 1;
  optional uint32 invariant_source_union_layer_count = 2;
  optional uint32 native_interface_complex_layer_count = 3;
  optional uint32 owned_critical_slab_count = 4;
}
// Complete actual occurrence query/slab coverage, not emitted physical union-boundary proof.
message NativeGeometryCoverageSummary {
  double requested_shape_error_mm = 1;
  double achieved_shape_error_mm = 2;
  uint32 height_analysis_count = 3;
  uint32 slab_count = 4;
  uint32 event_count = 5;
  uint64 geometry_work = 6;
  PreflightEvidence evidence = 7;
  SkinCoverageScope skin_coverage = 8;
  SupportClearanceScope support_clearance = 9;
  uint32 certified_layer_count = 10;
  NativeFeatureCoverageSummary source_feature_coverage = 11;
}
enum ProcessRegionStatus {
  PROCESS_REGION_STATUS_UNSPECIFIED = 0;
  PROCESS_REGION_STATUS_APPLIED = 1;
  PROCESS_REGION_STATUS_NO_ELIGIBLE_INTERIOR = 2;
  PROCESS_REGION_STATUS_NO_DENSITY_CHANGE = 3;
}
message ProcessRegionResolution {
  uint32 occurrence_id = 1;
  string definition_id = 2;
  ProcessProvenance provenance = 3;
  ProcessRegionStatus status = 4;
}
message ManufacturingSummary {
  uint32 layers = 1;
  uint32 paths = 2;
  uint32 deposition_segments = 3;
  double deposited_volume_mm3 = 4;
  double filament_length_mm = 5;
  bool software_only = 6;
  uint32 support_deposition_segments = 7;
  double support_deposited_volume_mm3 = 8;
  double support_filament_length_mm = 9;
  SurfaceResolutionTotals surface_resolution = 10;
  NativeGeometryCoverageSummary native_geometry = 11;
  repeated ProcessRegionResolution process_resolution = 12;
}
// Sampled nominal-bead advisory counts, not an emitted-verification certificate.
message SurfaceResolutionTotals { uint64 evaluated_witnesses = 1; uint64 resolved = 2; uint64 ambiguous = 3; uint64 below_nominal_resolution = 4; uint64 unavailable = 5; bool coverage_complete = 6; }
message VerificationReport {
  bool verified = 1;
  repeated string coverage = 2;
  repeated string limitations = 3;
  uint32 deposition_segments = 4;
  uint32 travel_segments = 5;
  double deposited_volume_mm3 = 6;
  double filament_length_mm = 7;
  double max_position_error_mm = 8;
  double max_extrusion_error_mm = 9;
  uint32 lifecycle_motion_count = 10;
  double priming_filament_length_mm = 11;
  uint32 support_deposition_segments = 12;
  double support_deposited_volume_mm3 = 13;
  double support_filament_length_mm = 14;
  uint32 retraction_count = 15;
  double retracted_filament_mm = 16;
}
