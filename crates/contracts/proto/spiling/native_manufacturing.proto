syntax = "proto3";
package spiling.engine;

import "google/longrunning/operations.proto";
import "spiling/native_common.proto";
import "spiling/native_hardware.proto";
import "spiling/native_project.proto";
import "spiling/native_material.proto";
import "spiling/native_appearance.proto";

service Manufacturing {
  rpc EvaluateAlternative(EvaluateManufacturingAlternativeRequest) returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = { response_type: "NativeOperationResult" metadata_type: "NativeOperationMetadata" };
  }
  rpc Execute(ManufacturingRequest) returns (ManufacturingReply);
  rpc Preflight(PreflightManufacturingRequest) returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      response_type: "NativeOperationResult"
      metadata_type: "NativeOperationMetadata"
    };
  }
  rpc Compile(CompileManufacturingRequest) returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      response_type: "NativeOperationResult"
      metadata_type: "NativeOperationMetadata"
    };
  }
  rpc Verify(VerifyManufacturingRequest) returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      response_type: "NativeOperationResult"
      metadata_type: "NativeOperationMetadata"
    };
  }
}

message ManufacturingRequest {
  string parent = 1; // sessions/{session_uuid}
  oneof command {
    GetManufacturingRequest get = 2;
    SetManufacturingIntentRequest set_intent = 3;
    ApplyMaterialProfileRequest apply_material_profile = 4;
    ReviewMaterialsRequest review_materials = 5;
  }
}
message GetManufacturingRequest {}
message EvaluateManufacturingAlternativeRequest {
  string parent = 1;
  string request_id = 2;
  uint32 base_revision = 3;
  string expected_context_hash = 4;
  ManufacturingIntent intent = 5;
}
enum ManufacturingInputGroup {
  MANUFACTURING_INPUT_GROUP_UNSPECIFIED = 0;
  MANUFACTURING_INPUT_GROUP_HARDWARE = 1;
  MANUFACTURING_INPUT_GROUP_MATERIAL_PROFILE = 2;
  MANUFACTURING_INPUT_GROUP_PRINTER = 3;
  MANUFACTURING_INPUT_GROUP_RECIPE = 4;
}
message ManufacturingInputChange {
  ManufacturingInputGroup group = 1;
  string path = 2;
  optional string before = 3;
  optional string after = 4;
}
message ManufacturingAlternativeEvaluation {
  string project_id = 1;
  uint32 captured_revision = 2;
  string context_hash = 3;
  ManufacturingIntent intent = 4;
  repeated ManufacturingInputChange changed_inputs = 5;
  bool changed_inputs_complete = 6;
  ManufacturingArtifactRecord record = 7;
  VerificationReport report = 8;
  ManufacturingInspectionProvenance provenance = 9;
  Artifact resource = 10;
  ReplayDisplayDescriptor replay_display = 11;
}
message ReviewMaterialsRequest {
  uint32 base_revision = 1;
  MaterialReviewRequest request = 2;
}
message ApplyMaterialProfileRequest {
  uint32 base_revision = 1;
  MaterialProfileSelection selection = 2;
}
message SetManufacturingIntentRequest {
  uint32 base_revision = 1; // Project revision, not scene publication revision.
  ManufacturingIntent intent = 2;
}
message CompileManufacturingRequest {
  string parent = 1;
  string request_id = 2; // Optional canonical nonnil UUID.
  uint32 base_revision = 3;
}
message PreflightManufacturingRequest {
  string parent = 1;
  string request_id = 2;
  uint32 base_revision = 3;
}
enum PreflightSeverity {
  PREFLIGHT_SEVERITY_UNSPECIFIED = 0;
  PREFLIGHT_ERROR = 1;
  PREFLIGHT_WARNING = 2;
  PREFLIGHT_INFO = 3;
}
enum PreflightDisposition {
  PREFLIGHT_DISPOSITION_UNSPECIFIED = 0;
  PREFLIGHT_ADMITTED = 1;
  PREFLIGHT_REFUSED = 2;
  PREFLIGHT_UNRESOLVED = 3;
}
enum PreflightEvidence {
  PREFLIGHT_EVIDENCE_UNSPECIFIED = 0;
  PREFLIGHT_NOT_EVALUATED = 1;
  PREFLIGHT_CERTIFIED = 2;
  PREFLIGHT_UNSUPPORTED = 3;
  PREFLIGHT_INDETERMINATE = 4;
  PREFLIGHT_FAILED = 5;
}
message PreflightCheck {
  string code = 1;
  PreflightSeverity severity = 2;
  string message = 3;
  optional uint32 occurrence_id = 4;
  optional string face_id = 5;
  PreflightEvidence evidence = 6;
  optional bool required = 7;
}
message PreflightReport {
  uint32 input_revision = 1;
  PreflightDisposition disposition = 2;
  bool software_only = 3;
  repeated PreflightCheck checks = 4;
}
message ManufacturingPreflightResult {
  PreflightReport report = 1;
}
message VerifyManufacturingRequest {
  string parent = 1;
  string request_id = 2;
  uint32 base_revision = 3;
  VerificationOutput output = 4;
}
// Domain failures use canonical Google Status, never a success reply arm.
message ManufacturingReply {
  oneof result {
    ManufacturingStatus status = 1;
    MaterialReviewReport material_review = 2;
  }
}
message ManufacturingStatus {
  string context_hash = 5;
  ProjectInfo info = 1;
  ManufacturingIntent intent = 2;
  ManufacturingArtifactRecord artifact = 3;
  Artifact resource = 4;
}
message ManufacturingCompiledResult {
  ProjectInfo info = 1;
  ManufacturingArtifactRecord record = 2;
  Artifact resource = 3;
}
message ManufacturingVerifiedResult {
  ManufacturingArtifactRecord record = 1;
  VerificationReport report = 2;
  Artifact resource = 3;
  ManufacturingInspectionProvenance provenance = 4;
  ReplayDisplayDescriptor replay_display = 5;
}

enum VerificationOutput {
  VERIFICATION_OUTPUT_UNSPECIFIED = 0;
  REPORT_ONLY = 1;
  REPORT_AND_MOTION = 2;
}
message ManufacturingInspectionProvenance {
  string project_id = 1;
  uint32 input_revision = 2;
  string input_hash = 3;
  KernelIdentity kernel = 4;
  string planner_version = 5;
  string emitter_version = 6;
  string verifier_version = 7;
  SurfaceOverlays surface_overlays = 8;
  ProcessDocument process_document = 9;
  JobWorkflow workflow = 10;
  repeated SurfaceColorInspection surface_color = 11;
}
message ReplayDisplayInfo {
  uint32 schema_version = 1;
  string bundle_hash = 2;
  string input_hash = 3;
  string program_hash = 4;
  string verifier_version = 5;
  PrinterCoordinateFrame frame = 6;
  uint32 event_count = 7;
  uint32 deposition_count = 8;
  uint32 travel_count = 9;
  uint32 layer_count = 10;
  AabbMm bounds_mm = 11;
  uint32 lifecycle_count = 12;
  uint32 process_count = 13;
  uint32 tool_epoch_count = 14;
  uint32 waste_count = 15;
}
message ReplayDisplayDescriptor {
  ReplayDisplayInfo info = 1;
  Artifact resource = 2;
}

message RoutedToolAccounting {
  uint32 tool = 1;
  string material_id = 2;
  uint32 model_deposition_segments = 3;
  double model_filament_length_mm = 4;
  double model_volume_mm3 = 5;
  uint32 waste_deposition_segments = 6;
  double waste_filament_length_mm = 7;
  double waste_volume_mm3 = 8;
  double outstanding_retraction_mm = 9;
}
message FixedDualVerification {
  uint32 selection_count = 1;
  // Exactly two entries, indexed by tool.
  repeated RoutedToolAccounting tools = 2;
}
enum LayerHeightReason {
  LAYER_HEIGHT_REASON_UNSPECIFIED = 0;
  LAYER_HEIGHT_REASON_REQUESTED = 1;
  LAYER_HEIGHT_REASON_PROCESS_MINIMUM = 2;
  LAYER_HEIGHT_REASON_PROCESS_MAXIMUM = 3;
}
message LayerHeightAssessment {
  LayerHeightPolicy policy = 1;
  double requested_mm = 2;
  double selected_mm = 3;
  LayerHeightReason reason = 4;
  double realized_min_mm = 5;
  double realized_max_mm = 6;
  uint32 layer_count = 7;
  uint32 differing_layer_count = 8;
  optional uint32 first_differing_layer = 9;
}
message ManufacturingArtifactRecord {
  string hash = 1;
  string input_hash = 2;
  uint32 byte_count = 3;
  ManufacturingSummary summary = 4;
}
enum SkinCoverageScope {
  SKIN_COVERAGE_SCOPE_UNSPECIFIED = 0;
  SCHEDULED_MATERIAL_DISTANCE = 1;
}
enum SupportClearanceScope {
  SUPPORT_CLEARANCE_SCOPE_UNSPECIFIED = 0;
  CONTINUOUS_TARGET_OUTER_OCCUPANCY = 1;
}
// Accepted scheduled-layer partition and explicit original-occurrence endpoint ownership.
message NativeFeatureCoverageSummary {
  optional uint32 disjoint_source_layer_count = 1;
  optional uint32 invariant_source_union_layer_count = 2;
  optional uint32 native_interface_complex_layer_count = 3;
  optional uint32 owned_critical_slab_count = 4;
}
// Complete actual occurrence query/slab coverage, not emitted physical union-boundary proof.
message NativeGeometryCoverageSummary {
  double requested_shape_error_mm = 1;
  double achieved_shape_error_mm = 2;
  uint32 height_analysis_count = 3;
  uint32 slab_count = 4;
  uint32 event_count = 5;
  uint64 geometry_work = 6;
  PreflightEvidence evidence = 7;
  SkinCoverageScope skin_coverage = 8;
  SupportClearanceScope support_clearance = 9;
  uint32 certified_layer_count = 10;
  NativeFeatureCoverageSummary source_feature_coverage = 11;
}
enum ProcessRegionStatus {
  PROCESS_REGION_STATUS_UNSPECIFIED = 0;
  PROCESS_REGION_STATUS_APPLIED = 1;
  PROCESS_REGION_STATUS_NO_ELIGIBLE_INTERIOR = 2;
  PROCESS_REGION_STATUS_NO_DENSITY_CHANGE = 3;
}
message ProcessRegionResolution {
  uint32 occurrence_id = 1;
  string definition_id = 2;
  ProcessProvenance provenance = 3;
  ProcessRegionStatus status = 4;
}
message ManufacturingSummary {
  LayerHeightAssessment layer_height = 14;
  uint32 layers = 1;
  uint32 paths = 2;
  uint32 deposition_segments = 3;
  double deposited_volume_mm3 = 4;
  double filament_length_mm = 5;
  bool software_only = 6;
  uint32 support_deposition_segments = 7;
  double support_deposited_volume_mm3 = 8;
  double support_filament_length_mm = 9;
  SurfaceResolutionTotals surface_resolution = 10;
  NativeGeometryCoverageSummary native_geometry = 11;
  repeated ProcessRegionResolution process_resolution = 12;
  FixedDualVerification routing = 13;
}
// Sampled nominal-bead advisory counts, not an emitted-verification certificate.
message SurfaceResolutionTotals { uint64 evaluated_witnesses = 1; uint64 resolved = 2; uint64 ambiguous = 3; uint64 below_nominal_resolution = 4; uint64 unavailable = 5; bool coverage_complete = 6; }
message VerificationReport {
  LayerHeightAssessment layer_height = 18;
  bool verified = 1;
  repeated string coverage = 2;
  repeated string limitations = 3;
  uint32 deposition_segments = 4;
  uint32 travel_segments = 5;
  double deposited_volume_mm3 = 6;
  double filament_length_mm = 7;
  double max_position_error_mm = 8;
  double max_extrusion_error_mm = 9;
  uint32 lifecycle_motion_count = 10;
  double priming_filament_length_mm = 11;
  uint32 support_deposition_segments = 12;
  double support_deposited_volume_mm3 = 13;
  double support_filament_length_mm = 14;
  uint32 retraction_count = 15;
  double retracted_filament_mm = 16;
  FixedDualVerification routing = 17;
}

// Actual replay qualifies nominal layer/owner associations; no measured optics.
message OpticalCycleExposure {
 double period_mm = 1;
 double phase_at_patch_mm = 2;
 uint64 complete_periods = 3;
 AppearanceChannels exposed_height_mm = 4;
 AppearanceChannels fractions = 5;
}
message OpticalUnassessedExposure { OpticalUnknownReason reason = 1; OpticalCycleExposure exposure = 2; }
enum OpticalUnknownReason {
 OPTICAL_UNKNOWN_REASON_UNSPECIFIED = 0;
 OPTICAL_UNKNOWN_REASON_MISSING_EVIDENCE = 1;
 OPTICAL_UNKNOWN_REASON_UNSUPPORTED_CONDITIONS = 2;
 OPTICAL_UNKNOWN_REASON_UNSUPPORTED_COLOR_DOMAIN = 3;
}
message OpticalReferenceEstimate {
 OpticalCycleExposure exposure = 1;
 AppearanceChannels predicted_lab = 2;
 repeated uint32 display_srgb8 = 3;
 double delta_e00 = 4;
 double delta_lightness = 5;
 bool within_tolerance = 6;
}
message OpticalInspectionAssessmentValue {
 oneof kind { OpticalUnassessedExposure unassessed = 1; OpticalReferenceEstimate estimate = 2; }
}
enum OpticalBackingModel {
 OPTICAL_BACKING_MODEL_UNSPECIFIED = 0;
 OPTICAL_BACKING_MODEL_UNMODELLED = 1;
}
message OpticalInspectionAssessment {
 string producer = 1;
 OpticalBackingModel backing_model = 2;
 bool patch_matches_request = 3;
 bool pose_matches_application = 4;
 OpticalInspectionAssessmentValue requested = 5;
 OpticalInspectionAssessmentValue realized = 6;
}
message SurfaceColorInspection {
 uint32 construction_index = 1;
 string face_id = 2;
 OpticalPatch realized_patch = 3;
 uint32 interval_count = 4;
 double tool_zero_exposed_height_mm = 5;
 double tool_one_exposed_height_mm = 6;
 double tool_zero_fraction = 7;
 double tool_one_fraction = 8;
 OpticalInspectionAssessment reference = 9;
}

enum MaterialSettingField {
  MATERIAL_SETTING_FIELD_UNSPECIFIED = 0;
  MATERIAL_SETTING_FIELD_NOZZLE_TEMPERATURE_C = 1;
  MATERIAL_SETTING_FIELD_BED_TEMPERATURE_C = 2;
  MATERIAL_SETTING_FIELD_PRINT_SPEED_MM_S = 3;
  MATERIAL_SETTING_FIELD_FILAMENT_DIAMETER_MM = 4;
  MATERIAL_SETTING_FIELD_FLOW_MULTIPLIER = 5;
  MATERIAL_SETTING_FIELD_MAX_VOLUMETRIC_FLOW_MM3_S = 6;
  MATERIAL_SETTING_FIELD_FIRST_LAYER_SPEED_FACTOR = 7;
  MATERIAL_SETTING_FIELD_FIRST_LAYER_FLOW_FACTOR = 8;
  MATERIAL_SETTING_FIELD_FAN_FIRST_LAYERS = 9;
  MATERIAL_SETTING_FIELD_FAN_AFTER_FIRST_LAYERS = 10;
  MATERIAL_SETTING_FIELD_BRIDGE_SPEED_FACTOR = 11;
  MATERIAL_SETTING_FIELD_BRIDGE_FLOW_FACTOR = 12;
  MATERIAL_SETTING_FIELD_BRIDGE_FAN_PWM = 13;
  MATERIAL_SETTING_FIELD_MAX_BRIDGE_SPAN_MM = 14;
  MATERIAL_SETTING_FIELD_RETRACTION_DISTANCE_MM = 15;
  MATERIAL_SETTING_FIELD_RETRACTION_SPEED_MM_S = 16;
  MATERIAL_SETTING_FIELD_RETRACTION_MINIMUM_TRAVEL_MM = 17;
  MATERIAL_SETTING_FIELD_RETRACTION_Z_HOP_MM = 18;
  MATERIAL_SETTING_FIELD_MIN_BEAD_WIDTH_MM = 19;
  MATERIAL_SETTING_FIELD_MAX_BEAD_WIDTH_MM = 20;
  MATERIAL_SETTING_FIELD_MIN_BEAD_HEIGHT_MM = 21;
  MATERIAL_SETTING_FIELD_MAX_BEAD_HEIGHT_MM = 22;
}

enum MaterialValueOrigin {
  MATERIAL_VALUE_ORIGIN_UNSPECIFIED = 0;
  MATERIAL_VALUE_ORIGIN_CURRENT_INTENT = 1;
  MATERIAL_VALUE_ORIGIN_SELECTED_PROFILE = 2;
  MATERIAL_VALUE_ORIGIN_EXPLICIT_OVERRIDE = 3;
  MATERIAL_VALUE_ORIGIN_MACHINE_LIMIT = 4;
  MATERIAL_VALUE_ORIGIN_MATERIAL_LIMIT = 5;
  MATERIAL_VALUE_ORIGIN_SHARED_LIMIT = 6;
}

enum MaterialCompatibilityCode {
  MATERIAL_COMPATIBILITY_CODE_UNSPECIFIED = 0;
  MATERIAL_COMPATIBILITY_CODE_PRINTER_MISMATCH = 1;
  MATERIAL_COMPATIBILITY_CODE_NOZZLE_MISMATCH = 2;
  MATERIAL_COMPATIBILITY_CODE_SETUP_MISMATCH = 3;
  MATERIAL_COMPATIBILITY_CODE_ABRASION_REQUIREMENT = 4;
  MATERIAL_COMPATIBILITY_CODE_PROCESS_CONSTRAINTS = 5;
}

message MaterialCatalog {
  MaterialToolSetup setup = 1;
  repeated MaterialProcessProfile profiles = 2;
}
message MaterialReviewRequest {
  MaterialCatalog catalog = 1;
  string query = 2;
  uint32 offset = 3;
}
message MaterialCompatibilityIssue {
  MaterialCompatibilityCode code = 1;
  string message = 2;
}
message MaterialSettingReview {
  MaterialSettingField field = 1;
  optional double current = 2;
  optional double proposed = 3;
  MaterialValueOrigin current_origin = 4;
  MaterialValueOrigin proposed_origin = 5;
}
message MaterialCandidateReview {
  MaterialProcessProfile profile = 1;
  MaterialToolSetup setup = 2;
  MaterialProfileOverrides overrides = 3;
  repeated MaterialCompatibilityIssue issues = 4;
  optional bool input_changed = 5;
  repeated MaterialSettingReview settings = 6;
}
message MaterialReviewReport {
  uint32 input_revision = 1;
  string query = 2;
  uint32 offset = 3;
  uint32 catalog_profiles = 4;
  uint32 matching_profiles = 5;
  repeated MaterialCandidateReview candidates = 6;
}
