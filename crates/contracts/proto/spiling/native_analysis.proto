syntax = "proto3";
package spiling.engine;
import "spiling/native_common.proto";
import "spiling/native_hardware.proto";
import "spiling/native_geometry.proto";

enum AnalysisMode { ANALYSIS_MODE_UNSPECIFIED = 0; ANALYSIS_MODE_BASIC = 1; ANALYSIS_MODE_ENHANCED = 2; }
message ForceDisk { Vec3 center_mm = 1; double diameter_mm = 2; }
message ForceFootprint { oneof kind { bool whole_face = 1; ForceDisk disk = 2; } }
message AnalysisFaceLoad { string face_id = 1; repeated double force_n = 2; repeated double moment_n_mm = 3; ForceFootprint footprint = 4; }
message AnalysisFaceRestraint { string face_id = 1; repeated bool fixed_translation = 2; }
message AnalysisHole { repeated string bore_faces = 1; repeated string cap_faces = 2; Vec3 center_mm = 3; double radius_mm = 4; double depth_mm = 5; }
enum HoleEnd { HOLE_END_UNSPECIFIED = 0; HOLE_END_START = 1; HOLE_END_END = 2; }
message FastenerClamp { HoleEnd end = 1; double washer_diameter_mm = 2; }
message FastenerPin { bool allow_axial_slide = 1; bool allow_spin = 2; }
message FastenerEngagement { HoleEnd end = 1; double engagement_mm = 2; }
message AnalysisFastener {
 uint32 id = 1;
 string name = 2;
 AnalysisHole hole = 3;
 oneof attachment { FastenerClamp clamp = 4; FastenerPin pin = 5; FastenerEngagement bonded_engagement = 6; }
}
message PrepareAnalysisFastenerRequest { string parent = 1; string request_id = 2; uint32 base_revision = 3; FaceRef reference = 4; }
message AnalysisFastenerPreparation {
 string project_id = 1;
 uint32 project_revision = 2;
 FaceRef reference = 3;
 string source_hash = 4;
 RigidPoseMm pose = 5;
 AnalysisHole hole = 6;
 repeated double outer_xy_mm = 7;
}
message AnalysisCase {
 string id = 1;
 string name = 2;
 string layout_id = 3;
 uint32 occurrence_id = 4;
 string definition_id = 5;
 string source_hash = 6;
 AnalysisMode mode = 7;
 repeated AnalysisFaceLoad loads = 8;
 repeated AnalysisFaceRestraint restraints = 9;
 repeated AnalysisFastener fasteners = 10;
}
message AnalysisCaseRecord { AnalysisCase case = 1; uint32 edited_revision = 2; }
message AnalysisResultRecord { string case_id = 1; string hash = 2; uint32 byte_count = 3; string input_hash = 4; uint32 captured_revision = 5; }
message AnalysisDocument { repeated AnalysisCaseRecord cases = 1; repeated AnalysisResultRecord results = 2; }
message AttachAnalysisResultRequest { uint32 base_revision = 1; string input_hash = 2; }
message GetAnalysisResultRequest { string parent = 1; string request_id = 2; uint32 base_revision = 3; string case_id = 4; }
message AnalysisEdit {
 oneof edit { AnalysisCase put = 1; string remove = 2; }
}
message EditAnalysisRequest { uint32 base_revision = 1; AnalysisEdit edit = 2; }
message AssumedPrintedLaws { string name = 1; repeated double wall_mpa = 2; repeated double skin_mpa = 3; repeated double effective_core_mpa = 4; PlanarPrintRecipe compatible_recipe = 5; string justification = 6; }
message AnalysisRunSettings { PlanarPrintRecipe recipe = 1; AssumedPrintedLaws laws = 2; double maximum_span_mm = 3; uint32 maximum_seconds = 4; }
message RunAnalysisRequest { string parent = 1; string request_id = 2; uint32 base_revision = 3; string case_id = 4; AnalysisRunSettings settings = 5; }
message AnalysisCompletedResult { string project_id = 1; uint32 captured_revision = 2; string input_hash = 3; Artifact resource = 4; }
message AnalysisResultPrepared { string project_id = 1; uint32 read_revision = 2; AnalysisResultRecord record = 3; Artifact resource = 4; }
message PrepareAnalysisFaceRequest { string parent = 1; string request_id = 2; uint32 base_revision = 3; FaceRef reference = 4; }
message AnalysisFacePreparation {
 string project_id = 1;
 uint32 project_revision = 2;
 FaceRef reference = 3;
 string source_hash = 4;
 RigidPoseMm pose = 5;
 double area_mm2 = 6;
 Vec3 centroid_mm = 7;
 Vec3 outward_normal = 8;
 Vec3 origin_mm = 9;
 Vec3 horizontal_direction = 10;
 double width_mm = 11;
 double height_mm = 12;
}
