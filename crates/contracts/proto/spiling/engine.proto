syntax = "proto3";
package spiling.engine;

import "google/longrunning/operations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "spiling/native_common.proto";
import "spiling/native_geometry.proto";
import "spiling/native_project.proto";
import "spiling/native_manufacturing.proto";

// Engine and clients ship together. No cross-version negotiation or shims.
service Engine {
  rpc GetEngineInfo(google.protobuf.Empty) returns (EngineInfo);
  rpc Shutdown(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc NameColors(NameColorsRequest) returns (NameColorsReply);
  rpc RunDiagnostic(RunDiagnosticRequest) returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      response_type: "DiagnosticResult"
      metadata_type: "DiagnosticMetadata"
    };
  }
  // Complete coalesced snapshots, not a replayable event log.
  rpc WatchOperation(WatchOperationRequest) returns (stream google.longrunning.Operation);
}

service Artifacts {
  rpc GetArtifact(GetArtifactRequest) returns (Artifact);
}

message EngineInfo {
  string instance_id = 1;
  string engine_build = 2;
  uint32 pid = 3;
  string kernel = 4;
  repeated string geometry_capabilities = 5;
  uint32 max_message_bytes = 6;
  uint32 max_artifact_bytes = 7;
  string session_id = 8;
  KernelIdentity kernel_identity = 9;
  GeometryLimits geometry_limits = 10;
  repeated string manufacturing_capabilities = 11;
  repeated string project_capabilities = 12;
}

message RunDiagnosticRequest {
  // Diagnostic namespace only; this does not create an authoring project.
  string parent = 1;
  string request_id = 2; // Optional nonzero UUID (AIP-155); deduplicated while retained.
  uint32 chunk_count = 3;
  uint32 delay_ms = 4;
  uint32 chunk_bytes = 5;
  string input_revision = 6;
}

enum DiagnosticState {
  DIAGNOSTIC_STATE_UNSPECIFIED = 0;
  QUEUED = 1;
  RUNNING = 2;
  CANCELLING = 3;
  SUCCEEDED = 4;
  FAILED = 5;
  CANCELLED = 6;
  INTERRUPTED = 7;
}

message DiagnosticMetadata {
  DiagnosticState state = 1;
  uint64 state_version = 2;
  string phase = 3;
  uint32 completed_units = 4;
  uint32 total_units = 5;
  string input_revision = 6;
  string input_digest = 7;
  // Append-only, complete immutable artifacts. Bounded to 64 entries.
  repeated Artifact outputs = 8;
  google.protobuf.Timestamp create_time = 9;
  google.protobuf.Timestamp update_time = 10;
  google.protobuf.Timestamp end_time = 11;
}

message DiagnosticResult { repeated Artifact artifacts = 1; }
message WatchOperationRequest { string name = 1; }
message GetArtifactRequest { string name = 1; }

enum NativeOperationState {
  NATIVE_OPERATION_STATE_UNSPECIFIED = 0;
  NATIVE_QUEUED = 1;
  NATIVE_RUNNING = 2;
  NATIVE_CANCELLING = 3;
  NATIVE_SUCCEEDED = 4;
  NATIVE_FAILED = 5;
  NATIVE_CANCELLED = 6;
  NATIVE_INTERRUPTED = 7;
}
message NativeOperationMetadata {
  NativeOperationState state = 1;
  uint64 state_version = 2;
  string session_id = 3;
  uint32 captured_scene_revision = 4;
  uint32 captured_project_revision = 5;
  string phase = 6;
  uint32 completed_units = 7;
  uint32 total_units = 8;
  repeated Artifact outputs = 9;
  google.protobuf.Timestamp create_time = 10;
  google.protobuf.Timestamp update_time = 11;
  google.protobuf.Timestamp end_time = 12;
}
message NativeOperationResult {
  oneof result {
    SceneSummary scene = 1;
    uint32 section_artifact_id = 2;
    ProjectInfo project_saved = 3;
    ManufacturingCompiledResult manufacturing_compiled = 4;
    ManufacturingVerifiedResult manufacturing_verified = 5;
    ManufacturingPreflightResult manufacturing_preflight = 6;
    SurfaceImageImportedResult surface_image_imported = 7;
    SurfaceImagePreparedResult surface_image_prepared = 8;
    BedPosePreparation bed_pose_prepared = 9;
    AppearancePaletteImportedResult appearance_palette_imported = 10;
    AppearanceComparedResult appearance_compared = 11;
    OpticalComparedResult optical_compared = 12;
    OpticalConstructionAppliedResult optical_construction_applied = 13;
  }
}

// Presentation-only names. No project mutation, material assignment or color calibration.
enum ColorNamingMode {
  COLOR_NAMING_MODE_UNSPECIFIED = 0;
  COLOR_NAMING_MODE_EXACT = 1;
  COLOR_NAMING_MODE_NEAREST = 2;
  COLOR_NAMING_MODE_DESCRIPTIVE = 3;
}
enum ColorModifier {
  COLOR_MODIFIER_NONE = 0;
  COLOR_MODIFIER_DARK = 1;
  COLOR_MODIFIER_LIGHT = 2;
  COLOR_MODIFIER_MUTED = 3;
  COLOR_MODIFIER_PALE = 4;
  COLOR_MODIFIER_VIVID = 5;
}
message ColorRgb8 { uint32 red = 1; uint32 green = 2; uint32 blue = 3; }
message NameColorsRequest {
  ColorNamingMode mode = 1;
  repeated ColorRgb8 colors = 2; // 1..64; all channels must be <=255.
}
message ColorNameMatch {
  string label = 1;
  string reference_name = 2;
  ColorRgb8 reference_srgb8 = 3;
  ColorModifier modifier = 4;
  bool generated = 5;
  double distance_oklab = 6;
}
message NamedColorSample {
  ColorRgb8 srgb8 = 1;
  string hex = 2;
  ColorNameMatch name = 3; // Absent only for an exact lookup miss.
}
message NameColorsReply {
  uint32 algorithm_version = 1;
  string dataset_sha256 = 2;
  ColorNamingMode mode = 3;
  repeated NamedColorSample colors = 4;
}
