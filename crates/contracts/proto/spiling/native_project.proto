syntax = "proto3";
package spiling.engine;
import "google/longrunning/operations.proto";
import "spiling/native_common.proto";
import "spiling/native_geometry.proto";
import "spiling/native_appearance.proto";
import "spiling/native_library.proto";
import "spiling/native_hardware.proto";
service Projects {
 rpc MatchStock(MatchStockRequest) returns (google.longrunning.Operation) {
  option (google.longrunning.operation_info) = {response_type:"NativeOperationResult" metadata_type:"NativeOperationMetadata"};
 }
 rpc StorageMaintenance(StorageMaintenanceRequest) returns (google.longrunning.Operation) {
  option (google.longrunning.operation_info) = {response_type:"NativeOperationResult" metadata_type:"NativeOperationMetadata"};
 }
 rpc ApplyOpticalConstruction(ApplyOpticalConstructionRequest) returns (google.longrunning.Operation) {
  option (google.longrunning.operation_info) = {response_type:"NativeOperationResult" metadata_type:"NativeOperationMetadata"};
 }
 rpc Execute(ProjectRequest) returns (ProjectReply);
 rpc Open(OpenProjectRequest) returns (google.longrunning.Operation) {
  option (google.longrunning.operation_info) = {response_type:"NativeOperationResult" metadata_type:"NativeOperationMetadata"};
 }
 rpc Save(SaveProjectRequest) returns (google.longrunning.Operation) {
  option (google.longrunning.operation_info) = {response_type:"NativeOperationResult" metadata_type:"NativeOperationMetadata"};
 }
 rpc ImportSurfaceImageFinish(ImportSurfaceImageFinishRequest) returns (google.longrunning.Operation) {
  option (google.longrunning.operation_info) = {response_type:"NativeOperationResult" metadata_type:"NativeOperationMetadata"};
 }
 rpc GetSurfaceImage(GetSurfaceImageRequest) returns (google.longrunning.Operation) {
  option (google.longrunning.operation_info) = {response_type:"NativeOperationResult" metadata_type:"NativeOperationMetadata"};
 }
 rpc ImportAppearancePalette(ImportAppearancePaletteRequest) returns (google.longrunning.Operation) {
  option (google.longrunning.operation_info) = {response_type:"NativeOperationResult" metadata_type:"NativeOperationMetadata"};
 }
 rpc CompareAppearance(CompareAppearanceRequest) returns (google.longrunning.Operation) {
  option (google.longrunning.operation_info) = {response_type:"NativeOperationResult" metadata_type:"NativeOperationMetadata"};
 }
 rpc GetAppearanceReport(GetAppearanceReportRequest) returns (google.longrunning.Operation) {
  option (google.longrunning.operation_info) = {response_type:"NativeOperationResult" metadata_type:"NativeOperationMetadata"};
 }
 rpc CompareOptical(CompareOpticalRequest) returns (google.longrunning.Operation) {
  option (google.longrunning.operation_info) = {response_type:"NativeOperationResult" metadata_type:"NativeOperationMetadata"};
 }
 rpc GetOpticalReport(GetOpticalReportRequest) returns (google.longrunning.Operation) {
  option (google.longrunning.operation_info) = {response_type:"NativeOperationResult" metadata_type:"NativeOperationMetadata"};
 }
}
message ProjectRequest {
 string parent = 1;
 oneof command {
  SelectPrintLayoutRequest select_print_layout = 27;
  EditPrintLayoutRequest edit_print_layout = 28;
  ProjectSetHardwareRequest set_hardware = 22;
  RetainManufacturingOptionRequest retain_manufacturing_option = 23;
  ManufacturingOptionRequest remove_manufacturing_option = 24;
  ManufacturingOptionRequest apply_manufacturing_option = 25;
  ManufacturingOptionRequest get_manufacturing_option = 26;
  ProjectPutRecipeRequest put_recipe = 17;
  ProjectGetRecipeRequest get_recipe = 18;
  ProjectListRecipesRequest list_recipes = 19;
  ProjectLoadRecipeStudyRequest load_recipe_study = 20;
  ProjectCaptureRecipeRequest capture_recipe = 21;
  ProjectPutFilamentRequest put_filament = 14;
  ProjectGetFilamentRequest get_filament = 15;
  ProjectListFilamentsRequest list_filaments = 16;
  GetProjectRequest get = 2;
  NewProjectRequest new = 3;
  UndoProjectRequest undo = 4;
  RedoProjectRequest redo = 5;
  AddSurfaceFinishRequest add_surface_finish = 6;
  RemoveSurfaceFinishRequest remove_surface_finish = 7;
  SetSurfaceFinishEnabledRequest set_surface_finish_enabled = 8;
  EditProcessRequest edit_process = 9;
  SetAppearanceTargetRequest set_appearance_target = 10;
  AcceptAppearanceReportRequest accept_appearance_report = 11;
  SetOpticalStudyRequest set_optical_study = 12;
  AcceptOpticalReportRequest accept_optical_report = 13;
 }
}
message ProjectSetHardwareRequest {string layout_id=3;uint32 base_revision=1; ProjectHardwareCapture capture=2;}
message MaterialCollectionRecord { string hash = 1; uint64 byte_count = 2; uint32 filament_count = 3; uint32 recipe_count = 4; }
message ProjectPutFilamentRequest { uint32 base_revision = 1; LibraryFilamentRevision revision = 2; LibraryOrigin origin = 3; optional string expected = 4; }
message ProjectGetFilamentRequest { uint32 base_revision = 1; LibraryFilamentRef reference = 2; }
message ProjectListFilamentsRequest { uint32 base_revision = 1; uint32 offset = 2; }
message ProjectFilamentPage { repeated LibraryFilamentSummary entries = 1; uint32 total = 2; optional uint32 next_offset = 3; }
message GetProjectRequest {}
message ManufacturingOption { string id = 1; string name = 2; string context_hash = 3; ManufacturingIntent intent = 4; }
message ManufacturingOptionInfo { string id = 1; string name = 2; string context_hash = 3; }
message RetainManufacturingOptionRequest {string layout_id=3; uint32 base_revision = 1; ManufacturingOption option = 2; }
message ManufacturingOptionRequest {string layout_id=3; uint32 base_revision = 1; string id = 2; }
message NewProjectRequest {uint32 base_revision = 1; bool discard_changes = 2;}
message UndoProjectRequest {uint32 base_revision = 1;}
message RedoProjectRequest {uint32 base_revision = 1;}
enum SurfaceScopeKind { SURFACE_SCOPE_KIND_UNSPECIFIED = 0; SURFACE_SCOPE_KIND_DEFINITION = 1; SURFACE_SCOPE_KIND_OCCURRENCE = 2; }
message SurfaceDefinitionScope { string definition_id = 1; }
message SurfaceOccurrenceScope { uint32 occurrence_id = 1; string expected_definition_id = 2; }
message SurfaceScope { oneof kind { SurfaceDefinitionScope definition = 1; SurfaceOccurrenceScope occurrence = 2; } }
message SurfaceSmooth {}
message SurfaceVerticalRibs { double depth_mm = 1; double pitch_mm = 2; double edge_margin_mm = 3; double phase_mm = 4; }
message SurfaceCylindricalRibs { double depth_mm = 1; uint32 rib_count = 2; double phase_fraction = 3; }
// Millimetres are explicit; U is repeat-cycle fraction, Z phase is physical source Z.
message ImageReliefParameters { double depth_mm = 1; uint32 u_repeats = 2; double u_phase_fraction = 3; double z_period_mm = 4; double z_phase_mm = 5; double edge_margin_mm = 6; double vertical_error_mm = 7; }
message SurfaceImageRelief { string image_hash = 1; ImageReliefParameters parameters = 2; }
message SurfaceImageRecord { string image_hash = 1; uint32 width = 2; uint32 height = 3; uint64 byte_count = 4; string source_hash = 5; string source_name = 6; }
message SurfaceFinish { oneof kind { SurfaceSmooth smooth = 1; SurfaceVerticalRibs vertical_ribs = 2; SurfaceCylindricalRibs cylindrical_ribs = 3; SurfaceImageRelief image_relief = 4; } }
message SurfaceLayer { uint32 layer_id = 1; bool enabled = 2; SurfaceScope scope = 3; string face_id = 4; SurfaceFinish finish = 5; }
message SurfaceOverlays { uint32 schema_version = 1; repeated SurfaceLayer layers = 2; repeated SurfaceImageRecord images = 3; }
message AddSurfaceFinishRequest { uint32 base_revision = 1; FaceRef face_ref = 2; SurfaceScopeKind scope = 3; SurfaceFinish finish = 4; }
message RemoveSurfaceFinishRequest { uint32 base_revision = 1; uint32 layer_id = 2; }
message SetSurfaceFinishEnabledRequest { uint32 base_revision = 1; uint32 layer_id = 2; bool enabled = 3; }
message WholeOwnedVolume {}
message SourceBoxMm { Vec3 min = 1; Vec3 max = 2; }
message ProcessSelector { oneof kind { WholeOwnedVolume whole_owned_volume = 1; SourceBoxMm source_box_mm = 2; } }
message SeparatorWallPermission {}
message HorizontalDiaphragmPermission { double thickness_mm = 1; }
message ProcessInterfacePermission {
 oneof kind {
  SeparatorWallPermission separator_wall = 1;
  HorizontalDiaphragmPermission horizontal_diaphragm = 2;
 }
}
message SparseFraction { double fraction = 1; }
message ProcessValue { oneof kind { SparseFraction sparse_fraction = 1; } }
message ProcessErase {}
message ProcessAction { oneof kind { ProcessValue replace = 1; ProcessErase erase = 2; } }
message ProcessOperation { uint32 operation_id = 1; ProcessSelector selector = 2; ProcessAction action = 3; optional ProcessInterfacePermission interface = 4; }
message ProcessLayer { uint32 layer_id = 1; SurfaceScope scope = 2; bool enabled = 3; repeated ProcessOperation operations = 4; }
message ProcessDocument { uint32 schema_version = 1; repeated ProcessLayer layers = 2; }
message ProcessProvenance { uint32 layer_id = 1; uint32 operation_id = 2; }
message ResolvedProcessValue { double fraction = 1; ProcessProvenance provenance = 2; }
message ResolvedOccurrenceProcess { uint32 occurrence_id = 1; string definition_id = 2; double global_fraction = 3; ResolvedProcessValue value = 4; ResolvedProcessValue inherited = 5; }
message AddProcessLayer { SurfaceScope scope = 1; ProcessSelector selector = 2; ProcessAction action = 3; optional ProcessInterfacePermission interface = 4; }
message RemoveProcessLayer { uint32 layer_id = 1; }
message SetProcessLayerEnabled { uint32 layer_id = 1; bool enabled = 2; }
message MoveProcessLayer { uint32 layer_id = 1; uint32 index = 2; }
message AddProcessOperation { uint32 layer_id = 1; ProcessSelector selector = 2; ProcessAction action = 3; optional ProcessInterfacePermission interface = 4; }
message UpdateProcessOperation { uint32 operation_id = 1; ProcessSelector selector = 2; ProcessAction action = 3; optional ProcessInterfacePermission interface = 4; }
message RemoveProcessOperation { uint32 operation_id = 1; }
message MoveProcessOperation { uint32 operation_id = 1; uint32 index = 2; }
message ResetProcessScope { SurfaceScope scope = 1; }
message SetProcessSparseFraction { SurfaceScope scope = 1; double fraction = 2; }
message SetProcessBoxSparseFraction { SurfaceScope scope = 1; Vec3 min = 2; Vec3 max = 3; double fraction = 4; optional ProcessInterfacePermission interface = 5; }
message ProcessEdit {
 oneof op {
  AddProcessLayer add_layer = 1;
  RemoveProcessLayer remove_layer = 2;
  SetProcessLayerEnabled set_layer_enabled = 3;
  MoveProcessLayer move_layer = 4;
  AddProcessOperation add_operation = 5;
  UpdateProcessOperation update_operation = 6;
  RemoveProcessOperation remove_operation = 7;
  MoveProcessOperation move_operation = 8;
  ResetProcessScope reset = 9;
  SetProcessSparseFraction set_sparse_fraction = 10;
  SetProcessBoxSparseFraction set_box_sparse_fraction = 11;
 }
}
message EditProcessRequest { uint32 base_revision = 1; ProcessEdit edit = 2; }
message OpenProjectRequest {string parent = 1; string request_id = 2; uint32 base_revision = 3; NativePath path = 4; bool read_only = 5; bool recover_previous = 6; bool discard_changes = 7;}
message SaveProjectRequest {string parent = 1; string request_id = 2; uint32 base_revision = 3; NativePath target = 4;}
enum StorageMaintenanceAction {
 STORAGE_MAINTENANCE_ACTION_UNSPECIFIED = 0;
 STORAGE_MAINTENANCE_ACTION_STATS = 1;
 STORAGE_MAINTENANCE_ACTION_COLLECT_UNREACHABLE = 2;
 STORAGE_MAINTENANCE_ACTION_COMPACT_TO_NEW = 3;
}
message StorageMaintenanceRequest { string parent = 1; string request_id = 2; uint32 base_revision = 3; StorageMaintenanceAction action = 4; NativePath target = 5; }
message ProjectStorageLimits {
 uint64 chunk_bytes = 1; uint64 object_bytes = 2; uint64 root_bytes = 3;
 uint64 guard_bytes = 4; uint64 snapshot_bytes = 5; uint64 database_bytes = 6;
 uint64 journal_bytes = 7; uint64 scratch_bytes = 8; uint64 scratch_entries = 9;
 uint64 snapshots = 10; uint64 membership_rows = 11; uint64 objects = 12;
 uint64 mapping_rows = 13; uint64 chunks = 14; uint64 members_per_snapshot = 15;
}
message ProjectStorageStats {
 uint64 current_raw_bytes = 1; uint64 previous_only_raw_bytes = 2;
 uint64 reachable_payload_bytes = 3; uint64 unreachable_payload_bytes = 4;
 uint64 database_bytes = 5; uint64 free_page_bytes = 6; uint64 journal_bytes = 7;
 uint64 snapshots = 8; uint64 objects = 9; uint64 chunks = 10;
 uint64 previous_only_payload_bytes = 11; uint64 scratch_bytes = 12;
 uint64 scratch_entries = 13; uint64 membership_rows = 14;
 uint64 mapping_rows = 15; uint64 retained_roots = 16; ProjectStorageLimits limits = 17;
}
message ProjectStorageMaintainedResult { StorageMaintenanceAction action = 1; ProjectStorageStats stats = 2; }
message ImportSurfaceImageFinishRequest { string parent = 1; string request_id = 2; uint32 base_revision = 3; FaceRef reference = 4; SurfaceScopeKind scope = 5; NativePath source = 6; ImageReliefParameters parameters = 7; }
message GetSurfaceImageRequest { string parent = 1; string request_id = 2; uint32 base_revision = 3; string image_hash = 4; }
message SurfaceImageImportedResult { ProjectInfo info = 1; SurfaceImageRecord image = 2; uint32 layer_id = 3; }
message SurfaceImagePreparedResult { string project_id = 1; uint32 captured_revision = 2; SurfaceImageRecord record = 3; Artifact resource = 4; }
message ProjectInfo {string project_id = 1; uint32 revision = 2; optional uint32 saved_revision = 3; optional string path_label = 4; bool dirty = 5; bool save_uncertain = 6; bool read_only = 7; bool recovered_previous = 8; bool can_undo = 9; bool can_redo = 10; SurfaceOverlays surface_overlays = 11; ProcessDocument process_document = 12; repeated ResolvedOccurrenceProcess resolved_process = 13; AppearanceStudyInfo appearance_study = 14; MaterialCollectionRecord materials = 15; ProjectHardwareCapture hardware=16; repeated ManufacturingOptionInfo manufacturing_options = 17; string layout_id = 18; repeated PrintLayoutInfo layouts = 19;}
message ProjectSceneChanged {ProjectInfo info = 1; SceneSummary summary = 2;}
message ProjectReply {oneof response {ProjectInfo status = 1; ProjectSceneChanged scene_changed = 2; ProjectFilamentPage filaments = 3; LibraryFilamentRevision filament = 4; LibraryRecipeTransfer recipe = 5; ProjectRecipePage recipes = 6; ManufacturingOption manufacturing_option = 7;}}
message ImportAppearancePaletteRequest { string parent = 1; string request_id = 2; uint32 base_revision = 3; NativePath source = 4; }
message CompareAppearanceRequest { string parent = 1; string request_id = 2; uint32 base_revision = 3; }
message GetAppearanceReportRequest { string parent = 1; string request_id = 2; uint32 base_revision = 3; }
message SetAppearanceTargetRequest { uint32 base_revision = 1; AppearanceTarget target = 2; AppearanceSearchLimits limits = 3; }
message AcceptAppearanceReportRequest { uint32 base_revision = 1; string report_hash = 2; optional string selection = 3; }
message AppearancePaletteImportedResult { ProjectInfo info = 1; AppearancePaletteRecord palette = 2; }
message AppearanceComparedResult { string project_id = 1; uint32 captured_revision = 2; AppearanceReportRecord record = 3; Artifact resource = 4; }
message SetOpticalStudyRequest { uint32 base_revision = 1; OpticalRequest request = 2; }
message AcceptOpticalReportRequest { uint32 base_revision = 1; string report_hash = 2; OpticalSelection selection = 3; }
message CompareOpticalRequest { string parent = 1; string request_id = 2; uint32 base_revision = 3; }
message GetOpticalReportRequest { string parent = 1; string request_id = 2; uint32 base_revision = 3; }
message OpticalComparedResult { string project_id = 1; uint32 captured_revision = 2; OpticalReportRecord record = 3; Artifact resource = 4; }

message OpticalMaterialBinding {
 string evidence_key = 1;
 string evidence_hash = 2;
 string loaded_material_id = 3;
 string loaded_declaration_hash = 4;
}
message ApplyOpticalConstructionParameters {
 uint32 construction_index = 1;
 string report_hash = 2;
 OpticalSelection selection = 3;
 repeated OpticalMaterialBinding bindings = 4;
}
message ApplyOpticalConstructionRequest {
 string parent = 1;
 string request_id = 2;
 uint32 base_revision = 3;
 ApplyOpticalConstructionParameters application = 4;
}
message OpticalConstructionAppliedResult {
 ProjectInfo info = 1;
 uint32 construction_index = 2;
}

message ProjectPutRecipeRequest { uint32 base_revision = 1; LibraryRecipeTransfer transfer = 2; optional string expected = 3; }
message ProjectGetRecipeRequest { uint32 base_revision = 1; LibraryRecipeRef reference = 2; }
message ProjectListRecipesRequest { uint32 base_revision = 1; uint32 offset = 2; }
message ProjectRecipePage { repeated LibraryRecipeSummary entries = 1; uint32 total = 2; optional uint32 next_offset = 3; }
message ProjectLoadRecipeStudyRequest { uint32 base_revision = 1; LibraryRecipeRef reference = 2; RecipeStudyContext context = 3; }
message ProjectCaptureRecipeRequest { uint32 base_revision = 1; string id = 2; string name = 3; repeated LibraryRecipeIngredient ingredients = 4; optional string expected = 5; }

enum StockScope { STOCK_SCOPE_UNSPECIFIED=0; STOCK_PROJECT=1; STOCK_MY_LIBRARY=2; STOCK_BOTH=3; }
message StockQuery {StockScope scope=1;bool on_hand_only=2;OpticalTarget target=3;OpticalPatch patch=4;double slot_height_mm=5;uint32 max_evaluations=6;}
message MatchStockRequest {string parent=1;string request_id=2;uint32 base_revision=3;StockQuery query=4;}
message StockMatchRecord {string hash=1;uint64 byte_count=2;string input_hash=3;string producer=4;bool complete=5;}
message StockMatchedResult {string project_id=1;uint32 captured_revision=2;StockMatchRecord record=3;Artifact resource=4;}

message PrintLayoutInfo {string layout_id=1; string name=2; uint32 occurrence_count=3; bool configured=4; bool has_result=5;}

message SelectPrintLayoutRequest {uint32 base_revision=1; string layout_id=2;}
message EditPrintLayoutRequest {uint32 base_revision=1; PrintLayoutEdit edit=2;}
message PrintLayoutEdit {oneof edit {CreatePrintLayout create=1; RenamePrintLayout rename=2; RemovePrintLayout remove=3; ReorderPrintLayouts reorder=4; TransferPrintParts transfer=5; DuplicatePrintLayout duplicate=6;}}
message CreatePrintLayout {string name=1; optional string copy_setup_from=2;}
message RenamePrintLayout {string layout_id=1; string name=2;}
message RemovePrintLayout {string layout_id=1;}
message ReorderPrintLayouts {repeated string layout_ids=1;}
message TransferPrintParts {string source=1; string target=2; repeated uint32 occurrences=3; bool copy=4;}

message DuplicatePrintLayout {string source=1; string name=2;}
