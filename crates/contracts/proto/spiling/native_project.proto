syntax = "proto3";
package spiling.engine;
import "google/longrunning/operations.proto";
import "spiling/native_common.proto";
import "spiling/native_geometry.proto";
service Projects {
 rpc Execute(ProjectRequest) returns (ProjectReply);
 rpc Open(OpenProjectRequest) returns (google.longrunning.Operation) {
  option (google.longrunning.operation_info) = {response_type:"NativeOperationResult" metadata_type:"NativeOperationMetadata"};
 }
 rpc Save(SaveProjectRequest) returns (google.longrunning.Operation) {
  option (google.longrunning.operation_info) = {response_type:"NativeOperationResult" metadata_type:"NativeOperationMetadata"};
 }
}
message ProjectRequest {
 string parent = 1;
 oneof command {
  GetProjectRequest get = 2;
  NewProjectRequest new = 3;
  UndoProjectRequest undo = 4;
  RedoProjectRequest redo = 5;
  AddSurfaceFinishRequest add_surface_finish = 6;
  RemoveSurfaceFinishRequest remove_surface_finish = 7;
  SetSurfaceFinishEnabledRequest set_surface_finish_enabled = 8;
 }
}
message GetProjectRequest {}
message NewProjectRequest {uint32 base_revision = 1; bool discard_changes = 2;}
message UndoProjectRequest {uint32 base_revision = 1;}
message RedoProjectRequest {uint32 base_revision = 1;}
enum SurfaceScopeKind { SURFACE_SCOPE_KIND_UNSPECIFIED = 0; SURFACE_SCOPE_KIND_DEFINITION = 1; SURFACE_SCOPE_KIND_OCCURRENCE = 2; }
message SurfaceDefinitionScope { string definition_id = 1; }
message SurfaceOccurrenceScope { uint32 occurrence_id = 1; string expected_definition_id = 2; }
message SurfaceScope { oneof kind { SurfaceDefinitionScope definition = 1; SurfaceOccurrenceScope occurrence = 2; } }
message SurfaceSmooth {}
message SurfaceVerticalRibs { double depth_mm = 1; double pitch_mm = 2; double edge_margin_mm = 3; double phase_mm = 4; }
message SurfaceFinish { oneof kind { SurfaceSmooth smooth = 1; SurfaceVerticalRibs vertical_ribs = 2; } }
message SurfaceLayer { uint32 layer_id = 1; bool enabled = 2; SurfaceScope scope = 3; string face_id = 4; SurfaceFinish finish = 5; }
message SurfaceOverlays { uint32 schema_version = 1; repeated SurfaceLayer layers = 2; }
message AddSurfaceFinishRequest { uint32 base_revision = 1; FaceRef face_ref = 2; SurfaceScopeKind scope = 3; SurfaceFinish finish = 4; }
message RemoveSurfaceFinishRequest { uint32 base_revision = 1; uint32 layer_id = 2; }
message SetSurfaceFinishEnabledRequest { uint32 base_revision = 1; uint32 layer_id = 2; bool enabled = 3; }
message OpenProjectRequest {string parent = 1; string request_id = 2; uint32 base_revision = 3; NativePath path = 4; bool read_only = 5; bool recover_previous = 6; bool discard_changes = 7;}
message SaveProjectRequest {string parent = 1; string request_id = 2; uint32 base_revision = 3; NativePath target = 4;}
message ProjectInfo {string project_id = 1; uint32 revision = 2; optional uint32 saved_revision = 3; optional string path_label = 4; bool dirty = 5; bool save_uncertain = 6; bool read_only = 7; bool recovered_previous = 8; bool can_undo = 9; bool can_redo = 10; SurfaceOverlays surface_overlays = 11;}
message ProjectSceneChanged {ProjectInfo info = 1; SceneSummary summary = 2;}
message ProjectReply {oneof response {ProjectInfo status = 1; ProjectSceneChanged scene_changed = 2;}}
