syntax = "proto3";
package spiling.engine;
import "google/longrunning/operations.proto";
import "spiling/native_common.proto";
import "spiling/native_geometry.proto";
service Projects {
 rpc Execute(ProjectRequest) returns (ProjectReply);
 rpc Open(OpenProjectRequest) returns (google.longrunning.Operation) {
  option (google.longrunning.operation_info) = {response_type:"NativeOperationResult" metadata_type:"NativeOperationMetadata"};
 }
 rpc Save(SaveProjectRequest) returns (google.longrunning.Operation) {
  option (google.longrunning.operation_info) = {response_type:"NativeOperationResult" metadata_type:"NativeOperationMetadata"};
 }
 rpc ImportSurfaceImageFinish(ImportSurfaceImageFinishRequest) returns (google.longrunning.Operation) {
  option (google.longrunning.operation_info) = {response_type:"NativeOperationResult" metadata_type:"NativeOperationMetadata"};
 }
 rpc GetSurfaceImage(GetSurfaceImageRequest) returns (google.longrunning.Operation) {
  option (google.longrunning.operation_info) = {response_type:"NativeOperationResult" metadata_type:"NativeOperationMetadata"};
 }
}
message ProjectRequest {
 string parent = 1;
 oneof command {
  GetProjectRequest get = 2;
  NewProjectRequest new = 3;
  UndoProjectRequest undo = 4;
  RedoProjectRequest redo = 5;
  AddSurfaceFinishRequest add_surface_finish = 6;
  RemoveSurfaceFinishRequest remove_surface_finish = 7;
  SetSurfaceFinishEnabledRequest set_surface_finish_enabled = 8;
  EditProcessRequest edit_process = 9;
 }
}
message GetProjectRequest {}
message NewProjectRequest {uint32 base_revision = 1; bool discard_changes = 2;}
message UndoProjectRequest {uint32 base_revision = 1;}
message RedoProjectRequest {uint32 base_revision = 1;}
enum SurfaceScopeKind { SURFACE_SCOPE_KIND_UNSPECIFIED = 0; SURFACE_SCOPE_KIND_DEFINITION = 1; SURFACE_SCOPE_KIND_OCCURRENCE = 2; }
message SurfaceDefinitionScope { string definition_id = 1; }
message SurfaceOccurrenceScope { uint32 occurrence_id = 1; string expected_definition_id = 2; }
message SurfaceScope { oneof kind { SurfaceDefinitionScope definition = 1; SurfaceOccurrenceScope occurrence = 2; } }
message SurfaceSmooth {}
message SurfaceVerticalRibs { double depth_mm = 1; double pitch_mm = 2; double edge_margin_mm = 3; double phase_mm = 4; }
message SurfaceCylindricalRibs { double depth_mm = 1; uint32 rib_count = 2; double phase_fraction = 3; }
// Millimetres are explicit; U is repeat-cycle fraction, Z phase is physical source Z.
message ImageReliefParameters { double depth_mm = 1; uint32 u_repeats = 2; double u_phase_fraction = 3; double z_period_mm = 4; double z_phase_mm = 5; double edge_margin_mm = 6; double vertical_error_mm = 7; }
message SurfaceImageRelief { string image_hash = 1; ImageReliefParameters parameters = 2; }
message SurfaceImageRecord { string image_hash = 1; uint32 width = 2; uint32 height = 3; uint64 byte_count = 4; string source_hash = 5; string source_name = 6; }
message SurfaceFinish { oneof kind { SurfaceSmooth smooth = 1; SurfaceVerticalRibs vertical_ribs = 2; SurfaceCylindricalRibs cylindrical_ribs = 3; SurfaceImageRelief image_relief = 4; } }
message SurfaceLayer { uint32 layer_id = 1; bool enabled = 2; SurfaceScope scope = 3; string face_id = 4; SurfaceFinish finish = 5; }
message SurfaceOverlays { uint32 schema_version = 1; repeated SurfaceLayer layers = 2; repeated SurfaceImageRecord images = 3; }
message AddSurfaceFinishRequest { uint32 base_revision = 1; FaceRef face_ref = 2; SurfaceScopeKind scope = 3; SurfaceFinish finish = 4; }
message RemoveSurfaceFinishRequest { uint32 base_revision = 1; uint32 layer_id = 2; }
message SetSurfaceFinishEnabledRequest { uint32 base_revision = 1; uint32 layer_id = 2; bool enabled = 3; }
message WholeOwnedVolume {}
message SourceBoxMm { Vec3 min = 1; Vec3 max = 2; }
message ProcessSelector { oneof kind { WholeOwnedVolume whole_owned_volume = 1; SourceBoxMm source_box_mm = 2; } }
enum ProcessInterfacePermission { PROCESS_INTERFACE_PERMISSION_UNSPECIFIED = 0; PROCESS_INTERFACE_PERMISSION_SEPARATOR_WALL = 1; }
message SparseFraction { double fraction = 1; }
message ProcessValue { oneof kind { SparseFraction sparse_fraction = 1; } }
message ProcessErase {}
message ProcessAction { oneof kind { ProcessValue replace = 1; ProcessErase erase = 2; } }
message ProcessOperation { uint32 operation_id = 1; ProcessSelector selector = 2; ProcessAction action = 3; optional ProcessInterfacePermission interface = 4; }
message ProcessLayer { uint32 layer_id = 1; SurfaceScope scope = 2; bool enabled = 3; repeated ProcessOperation operations = 4; }
message ProcessDocument { uint32 schema_version = 1; repeated ProcessLayer layers = 2; }
message ProcessProvenance { uint32 layer_id = 1; uint32 operation_id = 2; }
message ResolvedProcessValue { double fraction = 1; ProcessProvenance provenance = 2; }
message ResolvedOccurrenceProcess { uint32 occurrence_id = 1; string definition_id = 2; double global_fraction = 3; ResolvedProcessValue value = 4; ResolvedProcessValue inherited = 5; }
message AddProcessLayer { SurfaceScope scope = 1; ProcessSelector selector = 2; ProcessAction action = 3; optional ProcessInterfacePermission interface = 4; }
message RemoveProcessLayer { uint32 layer_id = 1; }
message SetProcessLayerEnabled { uint32 layer_id = 1; bool enabled = 2; }
message MoveProcessLayer { uint32 layer_id = 1; uint32 index = 2; }
message AddProcessOperation { uint32 layer_id = 1; ProcessSelector selector = 2; ProcessAction action = 3; optional ProcessInterfacePermission interface = 4; }
message UpdateProcessOperation { uint32 operation_id = 1; ProcessSelector selector = 2; ProcessAction action = 3; optional ProcessInterfacePermission interface = 4; }
message RemoveProcessOperation { uint32 operation_id = 1; }
message MoveProcessOperation { uint32 operation_id = 1; uint32 index = 2; }
message ResetProcessScope { SurfaceScope scope = 1; }
message SetProcessSparseFraction { SurfaceScope scope = 1; double fraction = 2; }
message SetProcessBoxSparseFraction { SurfaceScope scope = 1; Vec3 min = 2; Vec3 max = 3; double fraction = 4; optional ProcessInterfacePermission interface = 5; }
message ProcessEdit {
 oneof op {
  AddProcessLayer add_layer = 1;
  RemoveProcessLayer remove_layer = 2;
  SetProcessLayerEnabled set_layer_enabled = 3;
  MoveProcessLayer move_layer = 4;
  AddProcessOperation add_operation = 5;
  UpdateProcessOperation update_operation = 6;
  RemoveProcessOperation remove_operation = 7;
  MoveProcessOperation move_operation = 8;
  ResetProcessScope reset = 9;
  SetProcessSparseFraction set_sparse_fraction = 10;
  SetProcessBoxSparseFraction set_box_sparse_fraction = 11;
 }
}
message EditProcessRequest { uint32 base_revision = 1; ProcessEdit edit = 2; }
message OpenProjectRequest {string parent = 1; string request_id = 2; uint32 base_revision = 3; NativePath path = 4; bool read_only = 5; bool recover_previous = 6; bool discard_changes = 7;}
message SaveProjectRequest {string parent = 1; string request_id = 2; uint32 base_revision = 3; NativePath target = 4;}
message ImportSurfaceImageFinishRequest { string parent = 1; string request_id = 2; uint32 base_revision = 3; FaceRef reference = 4; SurfaceScopeKind scope = 5; NativePath source = 6; ImageReliefParameters parameters = 7; }
message GetSurfaceImageRequest { string parent = 1; string request_id = 2; uint32 base_revision = 3; string image_hash = 4; }
message SurfaceImageImportedResult { ProjectInfo info = 1; SurfaceImageRecord image = 2; uint32 layer_id = 3; }
message SurfaceImagePreparedResult { string project_id = 1; uint32 captured_revision = 2; SurfaceImageRecord record = 3; Artifact resource = 4; }
message ProjectInfo {string project_id = 1; uint32 revision = 2; optional uint32 saved_revision = 3; optional string path_label = 4; bool dirty = 5; bool save_uncertain = 6; bool read_only = 7; bool recovered_previous = 8; bool can_undo = 9; bool can_redo = 10; SurfaceOverlays surface_overlays = 11; ProcessDocument process_document = 12; repeated ResolvedOccurrenceProcess resolved_process = 13;}
message ProjectSceneChanged {ProjectInfo info = 1; SceneSummary summary = 2;}
message ProjectReply {oneof response {ProjectInfo status = 1; ProjectSceneChanged scene_changed = 2;}}
