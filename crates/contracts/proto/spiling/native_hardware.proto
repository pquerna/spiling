syntax = "proto3";
package spiling.engine;
import "google/protobuf/empty.proto";
import "spiling/native_common.proto";
import "spiling/native_material.proto";
import "spiling/native_appearance.proto";
message ManufacturingIntent {
  PrinterSpecification printer = 1;
  PlanarPrintRecipe recipe = 2;
  ResolvedMaterialProfile material_profile = 3;
  ProjectHardwareCapture hardware = 4;
}

enum LayerHeightPolicy {
  LAYER_HEIGHT_POLICY_UNSPECIFIED = 0;
  LAYER_HEIGHT_POLICY_PREFERRED = 1;
  LAYER_HEIGHT_POLICY_PROTECTED_MAXIMUM = 2;
}

message PlanarPrintRecipe {
  string id = 1;
  string revision = 2;
  string material_id = 3;
  string material_revision = 4;
  double filament_diameter_mm = 5;
  double layer_height_mm = 6;
  LayerHeightPolicy layer_height_policy = 22;
  double bead_width_mm = 7;
  uint32 perimeter_count = 8;
  double infill_fraction = 9;
  double print_speed_mm_s = 10;
  double travel_speed_mm_s = 11;
  double flow_multiplier = 12;
  double top_skin_thickness_mm = 13;
  double bottom_skin_thickness_mm = 14;
  ProcessPolicy process = 15;
  SupportPolicy supports = 16;
  SeamPolicy seam_policy = 18;
  RectilinearAxisPolicy rectilinear_axis = 19;
  SparseInfillPolicy sparse_infill = 20;
  RectilinearAxisPolicy top_skin_axis = 21;
}
message NearestSeam {}
message CombineEligibleSparseInfill { double max_height_mm = 1; }
message SparseInfillPolicy {
  oneof policy {
    FineSparseInfill fine = 1;
    CombineEligibleSparseInfill combine_eligible = 2;
    GridSparseInfill grid = 3;
    WebRoofSparseInfill web_roof = 4;
  }
}
message FineSparseInfill {}
message GridSparseInfill {}
message WebRoofSparseInfill {
  optional double roof_spacing_mm = 1;
  optional WebArchitecture architecture = 2;
}
message WebArchitecture {
  optional WebOpening opening = 1;
  optional double pier_rib_depth_mm = 2;
}
message WebOpening {
  double bottom_z_mm = 1;
  double height_mm = 2;
  double width_mm = 3;
  double cap_height_mm = 4;
  double pier_width_mm = 5;
}
message PreferredBuildDirectionSeam {
  // Finite normalized unit vector in build/machine XY, not source or camera XY.
  double x = 1;
  double y = 2;
}
message SeamPolicy {
  oneof policy {
    NearestSeam nearest = 1;
    PreferredBuildDirectionSeam preferred_build_direction = 2;
    DistributedSeam distributed = 3;
  }
}
message DistributedSeam {}
enum RectilinearAxisPolicy {
  RECTILINEAR_AXIS_POLICY_UNSPECIFIED = 0;
  RECTILINEAR_X = 1;
  RECTILINEAR_Y = 2;
  ALTERNATING_XY = 3;
  ALTERNATING_YX = 4;
}
message SupportsDisabled {}
message BreakawaySupports {
  double density = 1;
  double xy_clearance_mm = 2;
  double z_gap_mm = 3;
  double interface_thickness_mm = 4;
}
message SupportPolicy {
  oneof policy {
    SupportsDisabled disabled = 1;
    BreakawaySupports breakaway = 2;
  }
}
enum PrinterCoordinateFrame {
  PRINTER_COORDINATE_FRAME_UNSPECIFIED = 0;
  RIGHT_HANDED_MILLIMETRES = 1;
}
enum MotionSpace {
  MOTION_SPACE_UNSPECIFIED = 0;
  CARTESIAN_XYZ = 1;
}
enum OutputDialect {
  OUTPUT_DIALECT_UNSPECIFIED = 0;
  CARTESIAN_ABSOLUTE_GCODE_V1 = 1;
  MARLIN2_SINGLE_EXTRUDER_GCODE_V1 = 2;
  MARLIN2_FIXED_DUAL_GCODE_V1 = 3;
  PRUSA_MARLIN_SINGLE_EXTRUDER_GCODE_V1 = 4;
  KLIPPER_SINGLE_EXTRUDER_GCODE_V1 = 5;
  // Planning only: emission refuses until .gcode.3mf delivery exists.
  BAMBU_LAB_GCODE_3MF_V1 = 6;
}
message PrinterCapabilities {
  MotionSpace motion_space = 1;
  uint32 extruders = 2;
  OutputDialect output_dialect = 3;
  bool generated_supports = 4;
  bool arc_moves = 5;
}
enum MachineComponentRole {
  MACHINE_COMPONENT_ROLE_UNSPECIFIED = 0;
  BED = 1;
  TOOLHEAD = 2;
  FIXTURE = 3;
}
message CylinderComponentShape {
  double radius_mm = 1;
  double height_mm = 2;
}
message MachineComponentShape {
  oneof shape {
    AabbMm box = 1;
    CylinderComponentShape cylinder = 2;
  }
}
message MachineComponent {
  string id = 1;
  MachineComponentRole role = 2;
  RigidPoseMm pose = 3;
  MachineComponentShape shape = 4;
}
message PrinterSpecification {
  uint32 schema_version = 1;
  string id = 2;
  string revision = 3;
  string name = 4;
  PrinterCoordinateFrame coordinate_frame = 5;
  AabbMm build_envelope = 6;
  repeated MachineComponent components = 7;
  PrinterCapabilities capabilities = 8;
  double nozzle_diameter_mm = 9;
  reserved 10;
  double max_volumetric_flow_mm3_s = 11;
  JobWorkflow workflow = 12;
  DepositionLimits deposition_limits = 13;
  MotionResolution motion_resolution = 14;
  // Extruding commands (deposition, priming, waste).
  double max_print_feed_mm_s = 15;
  // Non-extruding motion: travel, lifecycle moves and retraction.
  double max_travel_feed_mm_s = 16;
}
message MotionResolution { double xy_mm = 1; double z_mm = 2; }
message DiagnosticBodyOnly {}
enum HomingCoordinateContract {
  HOMING_COORDINATE_CONTRACT_UNSPECIFIED = 0;
  MARLIN_NATIVE_CARTESIAN = 1;
}
message JobWorkflow {
  oneof workflow {
    DiagnosticBodyOnly diagnostic_body_only = 1;
    SingleExtruderJob complete_marlin = 2;
    FixedDualJob fixed_dual_marlin = 3;
  }
}
message SingleExtruderJob {
  string machine_id = 1;
  string firmware_version = 2;
  string configuration_hash = 3;
  string calibration_record_hash = 4;
  HomingCoordinateContract homing_contract = 5;
  Vec3 home_position_mm = 6;
  // Temperature targets/limits are finite positive integral Celsius degrees.
  // The declared lifecycle emits M149 C only when it declares celsius_units.
  double nozzle_temperature_c = 7;
  double bed_temperature_c = 8;
  double minimum_extrusion_temperature_c = 9;
  double maximum_nozzle_temperature_c = 10;
  double maximum_bed_temperature_c = 11;
  // Complete prime segment excludes the conservative whole-object XY bounds
  // plus half bead width and serialization padding, irrespective of Z/holes.
  Vec3 prime_start_mm = 12;
  Vec3 prime_end_mm = 13;
  double prime_filament_length_mm = 14;
  double prime_speed_mm_s = 15;
  reserved 16;
  // Exactly two values: XY park position.
  repeated double park_xy_mm = 17;
  double park_clearance_mm = 18;
  FirmwareLifecycle lifecycle = 19;
}

// Declared start/end lifecycle; values follow the Rust enum order from 1.
enum PositionEffect {
  POSITION_EFFECT_UNSPECIFIED = 0;
  POSITION_EFFECT_PRESERVED = 1;
  POSITION_EFFECT_UNKNOWN = 2;
}
enum ThermalEffect {
  THERMAL_EFFECT_UNSPECIFIED = 0;
  THERMAL_EFFECT_UNCHANGED = 1;
  THERMAL_EFFECT_TARGET = 2;
  THERMAL_EFFECT_WAIT = 3;
  THERMAL_EFFECT_OFF = 4;
}
enum LevellingEffect {
  LEVELLING_EFFECT_UNSPECIFIED = 0;
  LEVELLING_EFFECT_UNCHANGED = 1;
  LEVELLING_EFFECT_ACTIVE = 2;
  LEVELLING_EFFECT_OFF = 3;
}
enum ExtrusionEffect {
  EXTRUSION_EFFECT_UNSPECIFIED = 0;
  EXTRUSION_EFFECT_PRESERVED = 1;
  EXTRUSION_EFFECT_RESET = 2;
  EXTRUSION_EFFECT_UNKNOWN = 3;
}
enum ModeEffect {
  MODE_EFFECT_UNSPECIFIED = 0;
  MODE_EFFECT_PRESERVED = 1;
  MODE_EFFECT_UNKNOWN = 2;
}
message BlockEffects {
  bool homes = 1;
  PositionEffect position = 2;
  LevellingEffect levelling = 3;
  ThermalEffect bed = 4;
  ThermalEffect nozzle = 5;
  ExtrusionEffect extrusion = 6;
  ModeEffect modes = 7;
  bool fan_off = 8;
  bool motors_off = 9;
}
message LifecycleBlock {
  string label = 1;
  repeated string lines = 2;
  BlockEffects effects = 3;
}
message NozzleStage { optional double standby_c = 1; }
message LifecycleStep {
  oneof step {
    google.protobuf.Empty celsius_units = 1;
    google.protobuf.Empty volumetric_off = 2;
    google.protobuf.Empty feed_scale_reset = 3;
    google.protobuf.Empty flow_scale_reset = 4;
    google.protobuf.Empty fan_off = 5;
    google.protobuf.Empty nozzle_check = 6;
    string model_check = 7;
    google.protobuf.Empty bed_target = 8;
    google.protobuf.Empty bed_wait = 9;
    NozzleStage nozzle_target = 10;
    NozzleStage nozzle_wait = 11;
    google.protobuf.Empty home = 12;
    google.protobuf.Empty probe_mesh = 13;
    google.protobuf.Empty restore_mesh = 14;
    google.protobuf.Empty levelling_off = 15;
    google.protobuf.Empty restore_modes = 16;
    google.protobuf.Empty reset_extrusion = 17;
    google.protobuf.Empty prime = 18;
    google.protobuf.Empty barrier = 19;
    google.protobuf.Empty park = 20;
    google.protobuf.Empty nozzle_off = 21;
    google.protobuf.Empty bed_off = 22;
    google.protobuf.Empty motors_off = 23;
    LifecycleBlock block = 24;
  }
}
message FirmwareLifecycle {
  repeated LifecycleStep start = 1;
  repeated LifecycleStep end = 2;
}

enum FixedDualConfiguration {
  FIXED_DUAL_CONFIGURATION_UNSPECIFIED = 0;
  MARLIN2125_NATIVE_FIXED_HOTENDS = 1;
}
message LoadedMaterial {
  string id = 1;
  string revision = 2;
  string declaration_hash = 3;
  string polymer_family = 4;
}
message FixedDualTool {
  double waste_bead_width_mm = 19;
  ResolvedMaterialProfile material_profile = 18;
  string id = 1;
  string feeder_id = 2;
  LoadedMaterial material = 3;
  repeated double offset_xy_mm = 4;
  double nozzle_diameter_mm = 5;
  double filament_diameter_mm = 6;
  DepositionLimits deposition_limits = 7;
  double max_feed_mm_s = 8;
  double max_volumetric_flow_mm3_s = 9;
  double nozzle_temperature_c = 10;
  double standby_temperature_c = 11;
  double minimum_extrusion_temperature_c = 12;
  double maximum_nozzle_temperature_c = 13;
  double retract_filament_mm = 14;
  double retract_speed_mm_s = 15;
  double minimum_reprime_volume_mm3 = 16;
  // Exactly four coordinates: start X/Y, then end X/Y.
  repeated double waste_line_xy_mm = 17;
}
message UniformOccurrenceMaterial {
  string material_id = 1;
}
message LayerCycleOccurrenceMaterial {
  OpticalLayerCycle recipe = 1;
  // Exactly two ordered, distinct immutable loaded material identities.
  repeated string material_ids = 2;
}
enum InteriorToolPolicy {
  INTERIOR_TOOL_POLICY_UNSPECIFIED = 0;
  INTERIOR_TOOL_POLICY_AUTOMATIC = 1;
  INTERIOR_TOOL_POLICY_PRIMARY_ONLY = 2;
}
message InteriorToolOverride { bool enabled = 1; InteriorToolPolicy value = 2; }
message InteriorSelectionGoal {
  double minimum_modeled_saving_seconds = 1;
  double max_extra_model_fraction = 2;
  double max_extra_waste_mm3 = 3;
}
message InteriorToolBinding {
  optional string policy_context = 4;
  InteriorToolOverride policy_override = 3;
  string tool_id = 1;
  double bead_width_mm = 2;
}
message OccurrenceMaterialAssignment {
  InteriorToolBinding interior = 7;
  uint32 occurrence_id = 1;
  // Required for ambiguous uniform loading; cycles/constructions retain their own bindings.
  optional string tool_id = 6;
  reserved 2;
  AabbMm work_envelope_mm = 3;
  // Required: omission and unknown alternatives are rejected by adapters.
  oneof material {
    UniformOccurrenceMaterial uniform = 4;
    LayerCycleOccurrenceMaterial layer_cycle = 5;
  }
}
message DeclaredJobTimeModel {
  string id = 1;
  string revision = 2;
  double linear_acceleration_mm_s2 = 3;
  double filament_acceleration_mm_s2 = 4;
  repeated double tool_activation_seconds = 5;
  double command_overhead_seconds = 6;
}
message FixedDualJob {
  InteriorSelectionGoal interior_goal = 21;
  DeclaredJobTimeModel timing_model = 20;
  string machine_id = 1;
  FixedDualConfiguration configuration = 2;
  string firmware_revision = 3;
  string configuration_hash = 4;
  string calibration_record_hash = 5;
  HomingCoordinateContract homing_contract = 6;
  Vec3 home_position_mm = 7;
  double bed_temperature_c = 8;
  double maximum_bed_temperature_c = 9;
  // Exactly two tools and one or two occurrence reservations, in domain order.
  repeated FixedDualTool tools = 10;
  repeated OccurrenceMaterialAssignment assignments = 11;
  double transition_lift_mm = 12;
  AabbMm carriage_travel_bounds_mm = 13;
  AabbMm carriage_body_bounds_mm = 14;
  double inactive_nozzle_radius_mm = 15;
  Vec3 park_position_mm = 16;
  repeated SurfaceColorConstruction surface_constructions = 17;
  // Required presence: explicit null is true; omitted/false refuses.
  oneof functional_construction {
    FunctionalMaterialConstruction functional_material = 18;
    bool no_functional_construction = 19;
  }
}
message PlanarTKeyJoin {
  double reach_into_region_mm = 1;
  double reach_into_base_mm = 2;
  double pitch_mm = 3;
  double stem_width_mm = 4;
  double head_width_mm = 5;
  double head_depth_mm = 6;
  double edge_margin_mm = 7;
  double end_collar_height_mm = 8;
  double collar_head_width_mm = 9;
}
enum FunctionalInterfacePolicy {
  FUNCTIONAL_INTERFACE_POLICY_UNSPECIFIED = 0;
  FUNCTIONAL_INTERFACE_POLICY_DECLARED_SAME_FAMILY = 1;
  // Nominal geometry only; no adhesion or physical-retention credit.
  FUNCTIONAL_INTERFACE_POLICY_MECHANICAL_CAPTURE = 2;
}
message FunctionalFacePatch {
  // Exactly two finite, strictly ordered endpoints; horizontal minimum >= 0.
  repeated double horizontal_mm = 1;
  repeated double source_z_mm = 2;
}
message FunctionalMaterialConstruction {
  uint32 occurrence_id = 1;
  string definition_id = 2;
  string source_hash = 3;
  string face_id = 4;
  string material_id = 5;
  string base_material_id = 6;
  double minimum_pure_depth_mm = 7;
  PlanarTKeyJoin join = 8;
  // Required: missing, unspecified and unknown values refuse admission.
  FunctionalInterfacePolicy interface_policy = 9;
  // Required presence: explicit null is true; omitted/false refuses.
  oneof face_patch {
    FunctionalFacePatch patch = 10;
    bool no_face_patch = 11;
  }
  double minimum_solid_base_root_depth_mm = 12;
}
enum FunctionalBaseSolidZoneKind {
  FUNCTIONAL_BASE_SOLID_ZONE_KIND_UNSPECIFIED = 0;
  FUNCTIONAL_BASE_SOLID_ZONE_KIND_ROOT = 1;
  FUNCTIONAL_BASE_SOLID_ZONE_KIND_LOWER_LANDING = 2;
  FUNCTIONAL_BASE_SOLID_ZONE_KIND_UPPER_COVER = 3;
}
message FunctionalBaseSolidZone {
  FunctionalBaseSolidZoneKind kind = 1;
  repeated double inward_depth_mm = 2;
  repeated double physical_z_mm = 3;
}
// Inspectable frame only; source/native/replay proof remains independent.
message FunctionalMaterialFrame {
  uint32 occurrence_id = 1;
  string definition_id = 2;
  string source_hash = 3;
  string face_id = 4;
  Vec3 origin_mm = 5;
  Vec3 world_origin_mm = 6;
  Vec3 horizontal_direction = 7;
  Vec3 outward_normal = 8;
  double width_mm = 9;
  // Whole native source height and world middle-head interval, respectively.
  // Exactly two finite, strictly ordered endpoints each.
  repeated double source_z_mm = 10;
  repeated double key_middle_z_mm = 11;
  // One to sixteen sorted centers, including the selected U midpoint.
  repeated double key_centers_u_mm = 12;
  AabbMm stock_bounds_mm = 13;
  // Required pairs: selected U in the full native face and active world Z.
  repeated double selected_u_mm = 14;
  repeated double region_z_mm = 15;
  repeated FunctionalBaseSolidZone solid_base_zones = 16;
}
message SurfaceColorFace {
  string face_id = 1;
  double skin_depth_mm = 2;
  double backing_depth_mm = 3;
  SurfaceColorMask mask = 4;
}
message SurfaceColorMask {
  double min_u_mm = 1;
  double max_u_mm = 2;
}
message SurfaceColorConstruction {
  uint32 occurrence_id = 1;
  string definition_id = 2;
  string source_hash = 3;
  repeated SurfaceColorFace faces = 4;
  oneof shell {
    UniformOccurrenceMaterial uniform = 5;
    LayerCycleOccurrenceMaterial layer_cycle = 6;
  }
  string white_material_id = 7;
  OpticalConstructionOrigin optical_origin = 8;
}
message AppliedOpticalMaterial {
 AppearancePaletteRow evidence = 1;
 string evidence_hash = 2;
 LoadedMaterial loaded_material = 3;
}
message OpticalConstructionOrigin {
 OpticalReportRecord report = 1;
 string palette_hash = 2;
 OpticalSelection selection = 3;
 OpticalModel model = 4;
 OpticalObservation observation = 5;
 OpticalTarget target = 6;
 OpticalPatch requested_patch = 7;
 OpticalLayerCycle recipe = 8;
 repeated AppliedOpticalMaterial materials = 9;
 RigidPoseMm applied_pose = 10;
}

// Portable inert hardware definitions; never private inventory or credentials.
message HardwareModelDefinition {string id=1;string vendor=2;string model=3;string source=4;string mounting_interface=5;AabbMm declared_volume_mm=6;}
// Sourced machine facts; a setup's printer is derived from them.
enum FirmwareFamily {
  FIRMWARE_FAMILY_UNSPECIFIED = 0;
  FIRMWARE_FAMILY_MARLIN2 = 1;
  FIRMWARE_FAMILY_PRUSA_BUDDY = 2;
  FIRMWARE_FAMILY_KLIPPER = 3;
  FIRMWARE_FAMILY_BAMBU_LAB = 4;
}
enum MachineKinematics {
  MACHINE_KINEMATICS_UNSPECIFIED = 0;
  MACHINE_KINEMATICS_BED_SLINGER = 1;
  MACHINE_KINEMATICS_CORE_XY = 2;
}
enum BedLevelling {
  BED_LEVELLING_UNSPECIFIED = 0;
  BED_LEVELLING_MANUAL = 1;
  BED_LEVELLING_PROBE_MESH = 2;
  BED_LEVELLING_STORED_MESH = 3;
}
// Values follow MachineLimit::ALL order, starting at 1.
enum MachineLimit {
  MACHINE_LIMIT_UNSPECIFIED = 0;
  MACHINE_LIMIT_BED_X_MM = 1;
  MACHINE_LIMIT_BED_Y_MM = 2;
  MACHINE_LIMIT_MAX_Z_MM = 3;
  MACHINE_LIMIT_NOZZLE_DIAMETER_MM = 4;
  MACHINE_LIMIT_FILAMENT_DIAMETER_MM = 5;
  MACHINE_LIMIT_MAX_PRINT_FEED_MM_S = 6;
  MACHINE_LIMIT_MAX_TRAVEL_FEED_MM_S = 7;
  MACHINE_LIMIT_MAX_ACCELERATION_MM_S2 = 8;
  MACHINE_LIMIT_MAX_VOLUMETRIC_FLOW_MM3_S = 9;
  MACHINE_LIMIT_MAX_NOZZLE_TEMPERATURE_C = 10;
  MACHINE_LIMIT_MIN_EXTRUSION_TEMPERATURE_C = 11;
  MACHINE_LIMIT_MAX_BED_TEMPERATURE_C = 12;
  MACHINE_LIMIT_MIN_BEAD_WIDTH_PER_NOZZLE = 13;
  MACHINE_LIMIT_MAX_BEAD_WIDTH_PER_NOZZLE = 14;
  MACHINE_LIMIT_MAX_BEAD_HEIGHT_PER_NOZZLE = 15;
  MACHINE_LIMIT_XY_RESOLUTION_MM = 16;
  MACHINE_LIMIT_Z_RESOLUTION_MM = 17;
  MACHINE_LIMIT_TOOLHEAD_RADIUS_MM = 18;
  MACHINE_LIMIT_TOOLHEAD_HEIGHT_MM = 19;
}
message FactSource {oneof kind {string published=1;string family_default=2;google.protobuf.Empty operator_declared=3;}}
message SourcedLimit {MachineLimit key=1;double value=2;FactSource source=3;}
message MachineDescription {string id=1;repeated string lineage=2;FirmwareFamily firmware=3;MachineKinematics kinematics=4;BedLevelling levelling=5;bool heated_bed=6;bool arc_moves=7;repeated SourcedLimit limits=8;optional string printer_model=9;LifecycleBlock start_block=10;LifecycleBlock end_block=11;}
message HardwareSetupDefinition {string id=1;string label=2;HardwareModelDefinition model=3;PrinterSpecification printer=4;MachineDescription machine=5;}
message PlateFaceDefinition {string key=1;string label=2;string surface=3;AabbMm usable_mm=4;repeated AabbMm keepouts_mm=5;double max_bed_celsius=6;}
message PlateDefinition {string id=1;string label=2;string mounting_interface=3;double thickness_mm=4;double surface_z_mm=5;repeated PlateFaceDefinition faces=6;string source=7;}
message HardwareNozzle {double diameter_mm=1;string material=2;}
message AccessoryDefinition {string id=1;string label=2;string mounting_interface=3;oneof effect {HardwareNozzle nozzle=4;AabbMm fixture=5;}}
message ProjectHardwareCapture {HardwareSetupDefinition setup=1;PlateDefinition plate=2;string face=3;repeated AccessoryDefinition accessories=4;}
