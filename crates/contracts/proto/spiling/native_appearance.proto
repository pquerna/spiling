syntax = "proto3";
package spiling.engine;
import "spiling/native_common.proto";

message AppearanceChannels { double first = 1; double second = 2; double third = 3; }
message AppearanceColor {
 oneof encoding {
  AppearanceChannels srgb = 1;
  AppearanceChannels xyz_y1 = 2;
  AppearanceChannels xyz_y100 = 3;
  AppearanceChannels d65_lab = 4;
 }
}
enum AppearanceIlluminant { APPEARANCE_ILLUMINANT_UNSPECIFIED = 0; APPEARANCE_ILLUMINANT_D65 = 1; APPEARANCE_ILLUMINANT_D50 = 2; APPEARANCE_ILLUMINANT_UNKNOWN = 3; }
enum AppearanceObserver { APPEARANCE_OBSERVER_UNSPECIFIED = 0; APPEARANCE_OBSERVER_CIE1931_TWO_DEGREE = 1; APPEARANCE_OBSERVER_CIE1964_TEN_DEGREE = 2; APPEARANCE_OBSERVER_UNKNOWN = 3; }
message AppearanceConditions {
 AppearanceIlluminant illuminant = 1;
 AppearanceObserver observer = 2;
 optional string geometry = 3;
 optional string backing = 4;
 optional double thickness_mm = 5;
 optional string cohort = 6;
 optional string instrument = 7;
 optional string calibration = 8;
 optional double aperture_mm = 9;
 optional string specular = 10;
 optional string orientation = 11;
 optional string process = 12;
 optional string construction = 13;
}
enum AppearanceEvidenceScope { APPEARANCE_EVIDENCE_SCOPE_UNSPECIFIED = 0; APPEARANCE_EVIDENCE_SCOPE_CATALOG_ESTIMATES = 1; APPEARANCE_EVIDENCE_SCOPE_MEASURED = 2; }
message AppearanceTarget {
 AppearanceColor color = 1;
 double delta_e00_tolerance = 2;
 optional double lightness_tolerance = 3;
 AppearanceConditions conditions = 4;
 AppearanceEvidenceScope evidence_scope = 5;
}
message AppearanceSearchLimits { uint32 max_visited = 1; uint32 max_alternatives = 2; }
message AppearancePaletteRecord {
 string name = 1;
 string original_hash = 2;
 uint32 original_bytes = 3;
 string canonical_hash = 4;
 uint32 canonical_bytes = 5;
 string source_url = 6;
 string source_revision = 7;
 string license = 8;
 string conversion = 9;
}
message AppearanceReportRecord {
 string hash = 1;
 uint64 byte_count = 2;
 string input_hash = 3;
 string producer = 4;
 bool complete = 5;
}
message AppearanceStudyInfo {
 AppearancePaletteRecord palette = 1;
 AppearanceTarget target = 2;
 AppearanceSearchLimits limits = 3;
 AppearanceReportRecord report = 4;
 optional string selection = 5;
 OpticalStudyInfo optical = 6;
}

// Named reference estimate, pinned to prusa-fdm-mixer 007bb922994cdf985c324cb734f6504e805f6790.
// This is not a material calibration or a physical light-transport model.
enum OpticalModel {
 OPTICAL_MODEL_UNSPECIFIED = 0;
 OPTICAL_MODEL_PRUSA_V7_REFERENCE = 1;
}
enum OpticalView {
 OPTICAL_VIEW_UNSPECIFIED = 0;
 OPTICAL_VIEW_NORMAL_TO_PATCH = 1;
}
message OpticalObservation {
 AppearanceIlluminant illuminant = 1;
 AppearanceObserver observer = 2;
 OpticalView view = 3;
}
// Upright build-frame millimetres; outward normal lies in build XY.
message OpticalPatch {
 Vec3 origin_mm = 1;
 double normal_x = 2;
 double normal_y = 3;
 double width_mm = 4;
 double height_mm = 5;
}
message OpticalTarget {
 AppearanceColor color = 1;
 double delta_e00_tolerance = 2;
 optional double lightness_tolerance = 3;
}
message OpticalSlot { uint32 material = 1; double height_mm = 2; }
message OpticalLayerCycle {
 repeated OpticalSlot slots = 1;
 uint32 phase_slot = 2;
 double origin_z_mm = 3;
}
message OpticalPattern { repeated uint32 materials = 1; }
message OpticalSearchSpace {
 repeated OpticalPattern patterns = 1;
 repeated double slot_heights_mm = 2;
 repeated uint32 phase_slots = 3;
 double origin_z_mm = 4;
}
message OpticalRequest {
 OpticalModel model = 1;
 repeated string materials = 2;
 OpticalTarget target = 3;
 OpticalObservation observation = 4;
 OpticalPatch patch = 5;
 OpticalLayerCycle recipe = 6;
 OpticalSearchSpace search = 7;
 AppearanceSearchLimits limits = 8;
}
message OpticalRequestedSelection {}
message OpticalSelection {
 oneof kind {
  OpticalRequestedSelection requested = 1;
  uint32 candidate_index = 2;
 }
}
message OpticalReportRecord {
 string hash = 1;
 uint64 byte_count = 2;
 string input_hash = 3;
 string producer = 4;
 bool complete = 5;
}
message OpticalStudyInfo {
 OpticalRequest request = 1;
 OpticalReportRecord report = 2;
 OpticalSelection selection = 3;
}

message AppearanceCatalogEvidence { AppearanceChannels srgb = 1; }
message AppearanceMeasuredEvidence { AppearanceColor color = 1; AppearanceConditions conditions = 2; optional string material_lot = 3; }
message AppearanceUnknownEvidence { string reason = 1; }
message AppearancePaletteRow {
 string key = 1;
 string material_id = 2;
 string evidence_id = 3;
 string name = 4;
 oneof evidence {
  AppearanceCatalogEvidence catalog = 5;
  AppearanceMeasuredEvidence measured = 6;
  AppearanceUnknownEvidence unknown = 7;
 }
}
