syntax = "proto3";
package spiling.engine;
import "google/protobuf/empty.proto";
import "spiling/native_common.proto";
import "spiling/native_material.proto";
import "spiling/native_appearance.proto";
import "spiling/native_hardware.proto";

service Libraries {
 rpc SearchCatalog(CatalogQuery) returns (CatalogPage);
 rpc GetCatalogRecord(CatalogKey) returns (CatalogRecord);
 rpc GetHardwareCatalog(google.protobuf.Empty) returns (HardwareCatalog);
 rpc GetHardware(google.protobuf.Empty) returns (LibraryHardware);
 rpc GetStatus(google.protobuf.Empty) returns (UserLibraryStatus);
 rpc SetLocation(LibraryLocationRequest) returns (UserLibraryStatus);
 rpc ListFilaments(LibraryListFilamentsRequest) returns (LibraryFilamentPage);
 rpc GetFilament(LibraryGetFilamentRequest) returns (LibraryFilamentRevision);
 rpc ListSpools(LibraryListSpoolsRequest) returns (LibrarySpoolPage);
 rpc ListRecipes(LibraryListRecipesRequest) returns (LibraryRecipePage);
 rpc GetRecipe(LibraryGetRecipeRequest) returns (LibraryRecipeTransfer);
 rpc Write(LibraryWriteRequest) returns (LibraryWriteReceipt);
}
message LibraryLocationRequest { NativePath location = 1; }
message LibraryIdentity { string id = 1; uint64 revision = 2; }
message UserLibraryStatus {
 NativePath location = 1;
 LibraryIdentity identity = 2;
 uint32 filament_count = 3;
 uint32 spool_count = 4;
 uint32 recipe_count = 5;
}
message LibraryImportedSource { string name = 1; string sha256 = 2; }
message LibraryDefinitionSource {
 oneof kind { google.protobuf.Empty operator = 1; LibraryImportedSource imported = 2; }
}
message LibraryAppearanceDeclaration { AppearanceColor color = 1; LibraryDefinitionSource source = 2; }
message LibraryFilamentDefinition {
 FilamentDeclaration declaration = 7; CatalogRecord catalog_origin = 8;
 string name = 1; MaterialDefinition material = 2; optional string color_name = 3;
 LibraryAppearanceDeclaration appearance = 4; repeated MaterialProcessProfile profiles = 5;
 LibraryDefinitionSource source = 6;
}
message LibraryFilamentRef { string id = 1; string revision = 2; }
message LibraryFilamentRevision { LibraryFilamentRef reference = 1; LibraryFilamentDefinition definition = 2; }
message LibraryOrigin { string library_id = 1; LibraryFilamentRef filament = 2; }
message LibraryFilamentEntry { LibraryFilamentRef current = 1; bool archived = 2; LibraryOrigin origin = 3; }
message LibraryFilamentSummary {
 FilamentDeclaration declaration=9;
 LibraryFilamentEntry entry = 1; string name = 2; MaterialDefinition material = 3;
 optional string color_name = 4; LibraryAppearanceDeclaration appearance = 5;
 uint32 profile_count = 6; uint32 on_hand_spools = 7; uint32 earlier_spools = 8;
}
message LibraryListFilamentsRequest {
 LibraryIdentity expected = 1; string query = 2; uint32 offset = 3; uint32 page_size = 4;
 bool on_hand_only = 5; bool include_archived = 6;
}
message LibraryFilamentPage {
 LibraryIdentity identity = 1; repeated LibraryFilamentSummary entries = 2;
 uint32 total_matches = 3; optional uint32 next_offset = 4;
}
message LibraryGetFilamentRequest { string library_id = 1; LibraryFilamentRef reference = 2; }
enum LibraryStockState {
 LIBRARY_STOCK_STATE_UNSPECIFIED = 0; LIBRARY_STOCK_ON_HAND = 1;
 LIBRARY_STOCK_ORDERED = 2; LIBRARY_STOCK_EMPTY = 3; LIBRARY_STOCK_ARCHIVED = 4;
}
enum LibraryQuantitySource {
 LIBRARY_QUANTITY_SOURCE_UNSPECIFIED = 0; LIBRARY_QUANTITY_ENTERED = 1; LIBRARY_QUANTITY_WEIGHED = 2;
}
message LibraryStockQuantity { double remaining_g = 1; LibraryQuantitySource source = 2; }
message LibrarySpoolRecord {
 string id = 1; LibraryFilamentRef filament = 2; string name = 3;
 LibraryStockState state = 4; LibraryStockQuantity quantity = 5;
 optional string lot = 6; optional string location = 7;
}
message LibraryListSpoolsRequest {
 LibraryIdentity expected = 1; LibraryFilamentRef filament = 2; uint32 offset = 3; uint32 page_size = 4;
}
message LibrarySpoolPage {
 LibraryIdentity identity = 1; repeated LibrarySpoolRecord spools = 2;
 uint32 total_matches = 3; optional uint32 next_offset = 4;
}
message LibraryPutFilament {
 string id = 1; optional string expected = 2; LibraryFilamentDefinition definition = 3;
}
message LibraryArchiveFilament { LibraryFilamentRef filament = 1; bool archived = 2; }
message LibraryWriteRequest {
 optional string library_id = 1; string request_id = 2; uint64 base_revision = 3;
 oneof mutation {
  LibraryPutFilament put_filament = 4;
  LibraryArchiveFilament archive_filament = 5;
  LibrarySpoolRecord put_spool = 6;
  string remove_spool = 7;
  LibraryPutRecipe put_recipe = 8;
  LibraryRecipeRef remove_recipe = 9;
  HardwareLibrary replace_hardware = 10;
 }
}
enum LibraryPublication {
 LIBRARY_PUBLICATION_UNSPECIFIED = 0; LIBRARY_PUBLICATION_CONFIRMED = 1;
 LIBRARY_PUBLICATION_UNCONFIRMED = 2; LIBRARY_PUBLICATION_UNKNOWN = 3;
}
message LibraryWriteReceipt {
 LibraryIdentity identity = 1; string request_id = 2; LibraryPublication publication = 3;
 bool replayed = 4; optional string message = 5;
}

message LibraryRecipeRef { string id = 1; string revision = 2; }
message LibraryRecipeIngredient { LibraryFilamentRef filament = 1; string palette_key = 2; }
message LibraryRecipeDefinition {
 string name = 1; repeated LibraryRecipeIngredient ingredients = 2;
 AppearancePaletteDocument palette = 3; OpticalRequest request = 4;
}
message LibraryRecipeEntry { string id = 1; string revision = 2; LibraryRecipeDefinition definition = 3; }
message LibraryRecipeTransfer { LibraryRecipeEntry recipe = 1; repeated LibraryFilamentRevision filaments = 2; }
message LibraryRecipeSummary { LibraryRecipeRef reference = 1; string name = 2; uint32 ingredient_count = 3; AppearanceColor target = 4; }
message LibraryListRecipesRequest { LibraryIdentity expected = 1; string query = 2; uint32 offset = 3; }
message LibraryRecipePage { LibraryIdentity identity = 1; repeated LibraryRecipeSummary entries = 2; uint32 total_matches = 3; optional uint32 next_offset = 4; }
message LibraryGetRecipeRequest { string library_id = 1; LibraryRecipeRef reference = 2; }
message LibraryPutRecipe { LibraryRecipeTransfer transfer = 1; optional string expected = 2; }
message RecipeStudyContext { OpticalPatch patch = 1; double cycle_origin_z_mm = 2; }

// Private personal library data, excluded from portable project captures.
message PrinterIdentity { string manufacturer=1; string model=2; CatalogRecord catalog_origin=3; }
message OwnedMachine {string id=1;string nickname=2;optional string serial=3;optional string location=4; oneof configuration {HardwareSetupDefinition setup=5;google.protobuf.Empty unconfigured=8;}uint64 generation=6;PrinterIdentity identity=7;}
message OwnedPlate {string id=1;string nickname=2;PlateDefinition definition=3;optional string installed_machine=4;string notes=5;}
message OwnedAccessory {string id=1;string nickname=2;AccessoryDefinition definition=3;optional string installed_machine=4;}
message CredentialRef {string slot_id=1;string role=2;string backend=3;}
message EndpointRoute {string id=1;string machine_id=2;string family=3;string endpoint=4;string expected_identity=5;uint64 generation=6;CredentialRef credential=7;}
message LocalProjectHardwareBinding {string project_id=1;NativePath attachment=2;string capture_hash=3;string machine_id=4;string plate_id=5;uint64 machine_generation=6;}
message HardwareLibrary {repeated OwnedMachine machines=1;repeated OwnedPlate plates=2;repeated OwnedAccessory accessories=3;repeated EndpointRoute routes=4;repeated LocalProjectHardwareBinding bindings=5;}
message LibraryHardware {LibraryIdentity identity=1;HardwareLibrary hardware=2;}

message HardwareCatalog {repeated HardwareModelDefinition models=1;repeated HardwareSetupDefinition setups=2;repeated PlateDefinition plates=3;}

enum CatalogKind { CATALOG_KIND_UNSPECIFIED=0; CATALOG_FILAMENT=1; CATALOG_PRINTER=2; }
message FilamentDeclaration { optional string brand=1; optional string material_label=2; optional double diameter_mm=3; optional double hueforge_td_mm=4; }
message CatalogOrigin { string provider=1; string id=2; string revision=3; string snapshot=4; string content=5; string url=6; }
message CatalogFilament { string name=1; FilamentDeclaration declaration=2; bytes srgb=3; }
message CatalogPrinter { string manufacturer=1; string model=2; repeated string aliases=3; Vec3 volume_mm=4; string source_url=5; }
message CatalogRecord { CatalogOrigin origin=1; oneof item { CatalogFilament filament=2; CatalogPrinter printer=3; } }
message CatalogQuery { CatalogKind kind=1; string query=2; uint32 offset=3; optional string snapshot=4; }
message CatalogPage { string snapshot=1; CatalogQuery query=2; repeated CatalogRecord entries=3; uint32 total=4; optional uint32 next=5; }

message CatalogKey {CatalogKind kind=1;string provider=2;string id=3;}
