syntax = "proto3";
package spiling.engine;

import "spiling/native_common.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/empty.proto";

service Geometry {
  rpc Execute(GeometryRequest) returns (GeometryReply);
  rpc ImportPart(ImportPartRequest) returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = { response_type: "NativeOperationResult" metadata_type: "NativeOperationMetadata" };
  }
  rpc StartSection(StartSectionRequest) returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = { response_type: "NativeOperationResult" metadata_type: "NativeOperationMetadata" };
  }
  rpc PrepareLayout(PrepareLayoutRequest) returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = { response_type: "NativeOperationResult" metadata_type: "NativeOperationMetadata" };
  }
  rpc PrepareBedPose(PrepareBedPoseRequest) returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = { response_type: "NativeOperationResult" metadata_type: "NativeOperationMetadata" };
  }
}
message ImportPartRequest {
  string parent = 1;
  string request_id = 2;
  uint32 base_revision = 3;
  NativePath source = 4;
  RigidPoseMm initial_pose = 5;
  ModelImportOptions options = 6;
}
message StartSectionRequest {
  string parent = 1;
  string request_id = 2;
  uint32 base_revision = 3;
  PlaneMm plane = 4;
}
message PrepareBedPoseRequest {
  string parent = 1;
  string request_id = 2;
  uint32 base_revision = 3;
  uint32 project_revision = 4;
  uint32 occurrence_id = 5;
  string expected_definition_id = 6;
  RigidPoseMm expected_pose = 7;
  AabbMm envelope_mm = 8;
  bool center_xy = 9;
  double contact_tolerance_mm = 10;
}
message NativeBedBounds {}
message TolerantBedBounds { double join_mm = 1; double profile_mm = 2; }
message BedPosePreparation {
  string session_id = 1;
  uint32 scene_revision = 2;
  uint32 project_revision = 3;
  uint32 occurrence_id = 4;
  string definition_id = 5;
  RigidPoseMm original_pose = 6;
  RigidPoseMm pose = 7;
  AabbMm envelope_mm = 8;
  Vec3 minimum_lower_mm = 9;
  Vec3 minimum_upper_mm = 10;
  Vec3 maximum_lower_mm = 11;
  Vec3 maximum_upper_mm = 12;
  bool center_xy = 13;
  double contact_tolerance_mm = 14;
  double maximum_contact_gap_mm = 15;
  oneof basis { NativeBedBounds native_bounded = 16; TolerantBedBounds tolerant_model = 17; }
}
message GeometryRequest {
  oneof command {
    AddInstanceRequest add_instance = 1;
    SetInstancePoseRequest set_instance_pose = 2;
    RemoveInstanceRequest remove_instance = 3;
    GetSceneRequest get_scene = 4;
    GetScenePageRequest get_scene_page = 5;
    GetFaceIndexPageRequest get_face_index_page = 6;
    InspectFaceRequest inspect_face = 7;
    GetArtifactPageRequest get_artifact_page = 8;
    ReleaseArtifactRequest release_artifact = 9;
    ApplyLayoutRequest apply_layout = 10;
    GetLayoutOverviewRequest get_layout_overview = 11;
    GetLayoutOverviewPageRequest get_layout_overview_page = 12;
  }
}
message AddInstanceRequest { string session_id = 1; uint32 base_revision = 2; string definition_id = 3; RigidPoseMm pose = 4; }
message SetInstancePoseRequest { string session_id = 1; uint32 base_revision = 2; uint32 occurrence_id = 3; RigidPoseMm pose = 4; uint32 project_revision = 5; }
message RemoveInstanceRequest { string session_id = 1; uint32 base_revision = 2; uint32 occurrence_id = 3; }
message GetLayoutOverviewRequest { string session_id=1; uint32 scene_revision=2; uint32 project_revision=3; }
message GetLayoutOverviewPageRequest { string session_id=1; uint32 scene_revision=2; uint32 project_revision=3; LayoutOverviewPageKind kind=4; uint32 offset=5; }
enum LayoutOverviewPageKind { LAYOUT_OVERVIEW_PAGE_KIND_UNSPECIFIED = 0; LAYOUT_OVERVIEW_DEFINITIONS = 1; LAYOUT_OVERVIEW_PARTS = 2; }
// The overview is paged: the summary carries plate context and counts; definitions and parts follow.
message LayoutOverviewSummary { string session_id=1; uint32 scene_revision=2; string project_id=3; uint32 project_revision=4; repeated LayoutOverviewHeader layouts=5; uint32 definition_count=6; }
message LayoutOverviewHeader { string layout_id=1; AabbMm build_area_mm=2; bool captured_plate=3; uint32 part_count=4; }
message LayoutOverviewPart { uint32 layout_index=1; uint32 occurrence_id=2; AabbMm source_bounds_mm=3; string definition_id=4; RigidPoseMm pose=5; }
message LayoutOverviewPage { repeated DefinitionRecord definitions=1; repeated LayoutOverviewPart parts=2; optional uint32 next_offset=3; }
message GetSceneRequest { string session_id = 1; }
message GetScenePageRequest { string session_id = 1; uint32 revision = 2; ScenePageKind kind = 3; uint32 offset = 4; }
message GetFaceIndexPageRequest { string session_id = 1; string definition_id = 2; uint32 offset = 3; }
message InspectFaceRequest { FaceRef reference = 1; }
message GetArtifactPageRequest { string session_id = 1; uint32 artifact_id = 2; ArtifactPageKind kind = 3; uint32 offset = 4; }
message ReleaseArtifactRequest { string session_id = 1; uint32 artifact_id = 2; }
enum ScenePageKind { SCENE_PAGE_KIND_UNSPECIFIED = 0; DEFINITIONS = 1; OCCURRENCES = 2; }
enum ArtifactPageKind { ARTIFACT_PAGE_KIND_UNSPECIFIED = 0; CHUNKS = 1; LOOPS = 2; }
message GeometryReply {
  oneof response {
    SceneSummary scene_changed = 1;
    SceneSummary scene = 2;
    ScenePage scene_page = 3;
    FaceIndexPage face_index_page = 4;
    FaceInspection face_inspection = 5;
    ArtifactPage artifact_page = 6;
    google.protobuf.Empty released = 7;
    LayoutOverviewSummary layout_overview = 8;
    LayoutOverviewPage layout_overview_page = 9;
  }
}
message SceneSummary { string session_id = 1; uint32 revision = 2; uint32 definition_count = 3; uint32 occurrence_count = 4; AabbMm bounds_mm = 5; uint32 unique_mesh_bytes = 6; string layout_id=7; }
message ScenePage { repeated DefinitionRecord definitions = 1; repeated OccurrenceRecord occurrences = 2; optional uint32 next_offset = 3; }
message FaceIndexPage { repeated FaceIndexRow faces = 1; optional uint32 next_offset = 2; }
message ArtifactPage {
  ArtifactSummary summary = 1;
  repeated ArtifactChunkMetadata chunks = 2;
  repeated SectionLoopMetadata loops = 3;
  optional uint32 next_offset = 4;
  repeated Artifact resources = 5;
}
enum SourceUnit { SOURCE_UNIT_UNSPECIFIED = 0; MILLIMETRE = 1; METRE = 2; INCH = 3; MICROMETRE = 4; CENTIMETRE = 5; FOOT = 6; }
enum DisplayProfile { reserved 1; DISPLAY_PROFILE_UNSPECIFIED = 0; MESH_TRIMMED_MM_005_V2 = 2; MESH_TOLERANT_MM_005_V1 = 3; MESH_TOLERANT_MM_02_V1 = 4; MESH_TOLERANT_MM_1_V1 = 5; }
message SourceProvenance { string source_hash = 1; string source_name = 2; SourceUnit source_unit = 3; optional double uncertainty_mm = 4; optional string source_solid = 5; NormalizedSource normalized = 6; }
message NormalizedSource { string hash = 1; MeshSourceFormat format = 2; string selector = 3; repeated ImportFinding findings = 4; string object_name = 5; }
enum MeshSourceFormat { MESH_SOURCE_FORMAT_UNSPECIFIED = 0; STL = 1; THREE_MF = 2; }
message DefinitionDisplay {
  oneof kind { uint32 mesh_artifact_id = 1; DomainError unavailable = 2; }
}
message DefinitionRecord {
  reserved 5;
  string definition_id = 1; SourceProvenance provenance = 2; uint32 face_count = 3;
  AabbMm bounds_mm = 4; DefinitionDisplay display = 6;
}
message OccurrenceRecord { uint32 occurrence_id = 1; string definition_id = 2; RigidPoseMm pose = 3; }
message FaceRef { string session_id = 1; uint32 scene_revision = 2; uint32 occurrence_id = 3; string definition_id = 4; string face_id = 5; }
// Native family is descriptive and independent of the source STEP encoding.
enum SurfaceFamily {
  SURFACE_FAMILY_UNSPECIFIED = 0;
  PLANE = 1; CYLINDER = 2; CONE = 3; SPHERE = 4; TORUS = 5;
  B_SPLINE = 6; NURBS = 7; LINEAR_EXTRUSION = 8; REVOLUTION = 9; T_SPLINE = 10; FACETED = 11;
}
enum TorusKind { TORUS_KIND_UNSPECIFIED = 0; REGULAR_RING = 1; HORN = 2; SPINDLE = 3; }
message AnalyticSurfaceDescription {
  oneof kind {
    PlaneSurfaceDescription plane = 1;
    CylinderSurfaceDescription cylinder = 2;
    ConeSurfaceDescription cone = 3;
    SphereSurfaceDescription sphere = 4;
    TorusSurfaceDescription torus = 5;
  }
}
message PlaneSurfaceDescription { Vec3 origin_mm = 1; Vec3 normal = 2; }
message CylinderSurfaceDescription { Vec3 axis_origin_mm = 1; Vec3 axis_direction = 2; double radius_mm = 3; }
// radius(z) = reference_radius_mm + z * tan(semi_angle_radians), z along frame.z_axis.
message ConeSurfaceDescription { PlaneFrameMm frame = 1; double reference_radius_mm = 2; double semi_angle_radians = 3; }
message SphereSurfaceDescription { PlaneFrameMm frame = 1; double radius_mm = 2; }
message TorusSurfaceDescription { PlaneFrameMm frame = 1; double major_radius_mm = 2; double minor_radius_mm = 3; TorusKind kind = 4; }
message FaceDomainSummary {
  uint32 trim_loop_count = 1; uint32 inner_loop_count = 2;
  bool periodic_u = 3; bool periodic_v = 4; bool has_singular_boundary = 5;
}
message FaceGeometryInfo { SurfaceFamily family = 1; AnalyticSurfaceDescription analytic = 2; FaceDomainSummary domain = 3; }
// orientation is material-side direction relative to a regular frame; singular normals require limiting charts.
message FaceInfo {
  string face_id = 1; string surface_face_entity = 2; string source_entity_kind = 3; bool orientation = 4;
  FaceGeometryInfo geometry = 5; string source_surface_entity_kind = 6;
}
message FaceInspection { FaceRef reference = 1; FaceInfo face = 2; RigidPoseMm pose = 3; SourceProvenance provenance = 4; }
message FaceIndexRow { uint32 ordinal = 1; string face_id = 2; }
message PlaneFrameMm { Vec3 origin_mm = 1; Vec3 x_axis = 2; Vec3 y_axis = 3; Vec3 z_axis = 4; }
message MeshChunkMetadata {
  string session_id = 1; uint32 artifact_id = 2; string definition_id = 3;
  uint32 schema_version = 4; DisplayProfile mesh_profile = 5;
  uint32 chunk_index = 6; uint32 chunk_count = 7; uint32 byte_count = 8;
  string sha256 = 9; uint32 face_count = 10; AabbMm bounds_mm = 11;
  double carrier_deviation_mm = 12; double quantization_error_mm = 13;
  optional double trim_deviation_mm = 14;
}
message SectionChunkMetadata {
  string session_id = 1; uint32 artifact_id = 2; uint32 schema_version = 3;
  uint32 chunk_index = 4; uint32 chunk_count = 5; uint32 byte_count = 6;
  string sha256 = 7; uint32 first_loop_ordinal = 8; uint32 loop_count = 9;
}
message SectionLoopMetadata { uint32 ordinal = 1; uint32 occurrence_id = 2; string definition_id = 3; bool is_hole = 4; uint32 point_count = 5; }
message SectionSummary {
  string session_id = 1; uint32 artifact_id = 2; uint32 revision = 3; uint32 schema_version = 4;
  PlaneMm plane = 5; PlaneFrameMm frame = 6;
  uint32 total_loop_count = 7; uint32 chunk_count = 8; uint32 total_bytes = 9;
  double sampling_tolerance_mm = 10; double boolean_tolerance_mm = 11;
}
message ArtifactSummary { oneof kind { MeshArtifactSummary mesh = 1; SectionSummary section = 2; } }
message MeshArtifactSummary { uint32 artifact_id = 1; string definition_id = 2; uint32 chunk_count = 3; uint32 total_bytes = 4; }
message ArtifactChunkMetadata { oneof kind { MeshChunkMetadata mesh = 1; SectionChunkMetadata section = 2; } }

enum LayoutObjective { LAYOUT_OBJECTIVE_UNSPECIFIED = 0; LAYOUT_ARRANGE = 1; LAYOUT_COPIES = 2; LAYOUT_FILL = 3; }
enum LayoutStyle { LAYOUT_STYLE_UNSPECIFIED = 0; LAYOUT_BALANCED = 1; LAYOUT_DENSE = 2; }
message LayoutRequest { LayoutObjective objective = 1; optional uint32 template = 2; uint32 quantity = 3; repeated uint32 pinned = 4; double spacing_mm = 5; LayoutStyle style = 6; bool use_additional_plates = 7; }
message LayoutPlacement { uint32 source = 1; bool copy = 2; RigidPoseMm pose = 3; }
message PrepareLayoutRequest { string parent = 1; string request_id = 2; uint32 base_revision = 3; uint32 project_revision = 4; LayoutRequest request = 5; }
message ApplyLayoutRequest { string session_id = 1; uint32 base_revision = 2; uint32 project_revision = 3; string proposal_id = 4; }

message ModelImportOptions { optional SourceUnit stl_unit = 1; optional uint32 source_plate = 2; }

enum ImportFindingKind { IMPORT_FINDING_KIND_UNSPECIFIED = 0; IMPORT_FINDING_KIND_INFORMATION = 1; IMPORT_FINDING_KIND_CHANGED = 2; IMPORT_FINDING_KIND_NOT_APPLIED = 3; }
enum ImportFindingCode { IMPORT_FINDING_CODE_UNSPECIFIED = 0; IMPORT_FINDING_CODE_INTERPRETED_UNITS = 1; IMPORT_FINDING_CODE_DEGENERATE_FACETS = 2; IMPORT_FINDING_CODE_DUPLICATE_FACETS = 3; IMPORT_FINDING_CODE_BOUNDARY_WELD = 4; IMPORT_FINDING_CODE_CORRECTED_WINDING = 5; IMPORT_FINDING_CODE_COMPONENT_UNION = 6; IMPORT_FINDING_CODE_NEGATIVE_VOLUMES = 7; IMPORT_FINDING_CODE_FOREIGN_SETTINGS = 8; IMPORT_FINDING_CODE_PROCESS_CONTROL = 9; IMPORT_FINDING_CODE_SOURCE_PLATE = 10; IMPORT_FINDING_CODE_ANALYTIC_RECOVERY = 11; IMPORT_FINDING_CODE_APPEARANCE = 12; IMPORT_FINDING_CODE_NON_PRINTABLE = 13; }
message ImportFinding { ImportFindingKind kind = 1; ImportFindingCode code = 2; uint32 count = 3; string label = 4; string detail = 5; AabbMm bounds_mm = 6; optional double displacement_mm = 7; }
