[workspace]
resolver = "3"
members = ["xtask", "crates/model-import", "crates/deposition-routing", "crates/analysis", "crates/chunks", "crates/contracts", "crates/compute", "crates/core", "crates/core-ptac", "crates/geometry", "crates/manufacturing", "crates/surface-fields", "crates/appearance", "crates/engine-client", "apps/engine", "apps/cli", "apps/workbench", "tests"]
default-members = ["crates/deposition-routing", "crates/analysis", "crates/chunks", "crates/contracts", "crates/compute", "crates/core", "crates/core-ptac", "crates/geometry", "crates/manufacturing", "crates/surface-fields", "crates/appearance", "crates/engine-client", "apps/engine", "apps/cli", "apps/workbench"]
exclude = ["vendor/cpp_map", "vendor/boostvoronoi", "vendor/boolmesh", "vendor/tracel-llvm-bundler"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "OSL-3.0"
repository = "https://github.com/pquerna/spiling"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["process", "io-util", "io-std", "net", "time", "sync", "rt-multi-thread", "macros"] }
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
prost = "=0.14.4"
prost-types = "=0.14.4"
tokio-stream = { version = "=0.1.19", features = ["net", "sync"] }
uuid = { version = "=1.27.0", features = ["v4"] }
sha2 = "=0.10.9"
zstd = "=0.13.3"
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks", "limits"] }
spiling-core-ptac = { path = "crates/core-ptac" }
spiling-chunks = { path = "crates/chunks" }
tempfile = "=3.27.0"
rayon = "=1.12.0"
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }
spiling-contracts = { path = "crates/contracts" }
spiling-compute = { path = "crates/compute" }
spiling-deposition-routing = { path = "crates/deposition-routing" }
cubecl = { version = "=0.11.3", default-features = false, features = ["std", "cpu", "vulkan"] }
spiling-engine-client = { path = "crates/engine-client" }
spiling-surface-fields = { path = "crates/surface-fields" }
spiling-appearance = { path = "crates/appearance" }
png = "=0.18.1"
geo = "=0.32.0"
i_overlay = "=4.0.7"
boolmesh = "=0.2.2"
boostvoronoi = { version = "=0.12.1", default-features = false }
# Integration source: pquerna/integration-spiling-tracking; keep an exact tested revision.
solidcore = { version = "=1.0.1", git = "https://github.com/pquerna/solidcore", rev = "f7f4c7a3ac958550971f9ee5054e2b2e7861767b" }
solidcore-tess = { version = "=0.1.0", git = "https://github.com/pquerna/solidcore", rev = "f7f4c7a3ac958550971f9ee5054e2b2e7861767b" }
solidcore-step = { version = "=0.1.0", git = "https://github.com/pquerna/solidcore", rev = "f7f4c7a3ac958550971f9ee5054e2b2e7861767b" }
solidcore-record = { version = "=0.1.0", git = "https://github.com/pquerna/solidcore", rev = "f7f4c7a3ac958550971f9ee5054e2b2e7861767b" }
solidcore-convert = { version = "=0.1.0", git = "https://github.com/pquerna/solidcore", rev = "f7f4c7a3ac958550971f9ee5054e2b2e7861767b" }
solidcore-ops = { version = "=0.1.0", git = "https://github.com/pquerna/solidcore", rev = "f7f4c7a3ac958550971f9ee5054e2b2e7861767b" }
step-p21 = "=0.1.1"
spiling-geometry = { path = "crates/geometry" }
spiling-model-import = { path = "crates/model-import" }
quick-xml = "=0.41.0"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
spiling-core = { path = "crates/core" }
spiling-manufacturing = { path = "crates/manufacturing" }

# boostvoronoi's beach line uses cpp_map; the checked-in copy replaces its
# OS-seeded skip-list levels with a fixed seed so diagrams are deterministic.
# Snapshot and change record: vendor/cpp_map/UPSTREAM.toml.
[patch.crates-io]
tracel-llvm-bundler = { path = "vendor/tracel-llvm-bundler" }
boolmesh = { path = "vendor/boolmesh" }
cpp_map = { path = "vendor/cpp_map" }
boostvoronoi = { path = "vendor/boostvoronoi" }

# One fast default for check, test, run and debug binaries (`cargo test -p <crate>`):
# our crates unoptimized and incremental, so an edit rebuilds in seconds; dependencies
# (kernel, tess, compute, voronoi) optimized once per target dir, since they never rebuild
# in the loop. Release/profiling are for shipped binaries and CPU profiles only, never tests.
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Optimized and fast to rebuild, for the realistic corpus and CPU profiles: release's
# optimization without its LTO and single codegen unit, incremental, with symbols.
# Shipped-binary performance claims compare `release` against `release`.
[profile.profiling]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
debug = 1
strip = "none"
