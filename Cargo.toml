[workspace]
resolver = "3"
members = ["crates/contracts", "crates/core", "crates/geometry", "crates/manufacturing", "crates/surface-fields", "crates/appearance", "crates/engine-client", "apps/engine", "apps/cli", "apps/workbench", "tests"]
default-members = ["crates/contracts", "crates/core", "crates/geometry", "crates/manufacturing", "crates/surface-fields", "crates/appearance", "crates/engine-client", "apps/engine", "apps/cli", "apps/workbench"]
exclude = ["vendor/solidcraft/crates/geom", "vendor/solidcraft/crates/step"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "OSL-3.0"
repository = "https://github.com/pquerna/spiling"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["process", "io-util", "io-std", "net", "time", "sync", "rt-multi-thread", "macros"] }
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
prost = "=0.14.4"
prost-types = "=0.14.4"
tokio-stream = { version = "=0.1.19", features = ["net", "sync"] }
uuid = { version = "=1.27.0", features = ["v4"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }
spiling-contracts = { path = "crates/contracts" }
spiling-engine-client = { path = "crates/engine-client" }
spiling-surface-fields = { path = "crates/surface-fields" }
spiling-appearance = { path = "crates/appearance" }
png = "=0.18.1"
geo = "=0.32.0"
boostvoronoi = { version = "=0.12.1", default-features = false }
# Integration source: pquerna/integration-spiling-tracking; keep an exact tested revision.
solidcore = { version = "=0.0.1", git = "https://github.com/pquerna/solidcore", rev = "5d85d5818b144a3a115abb1cff21c23bf08de17e" }
solidcore-mesh = { version = "=0.0.1", git = "https://github.com/pquerna/solidcore", rev = "5d85d5818b144a3a115abb1cff21c23bf08de17e", features = ["nurbs-grid-mesh"] }
# Checked-in upstream snapshot and closure patch: vendor/solidcraft/UPSTREAM.toml.
solidcraft-geom = { version = "=0.18.1", path = "vendor/solidcraft/crates/geom" }
solidcraft-step = { version = "=0.18.1", path = "vendor/solidcraft/crates/step" }
step-p21 = "=0.1.1"
spiling-geometry = { path = "crates/geometry" }
spiling-core = { path = "crates/core" }
spiling-manufacturing = { path = "crates/manufacturing" }

[profile.dev]
debug = 0
incremental = false

# Keep geometry/manufacturing numerical work practical without optimizing the desktop stack.
[profile.dev.package.solidcore]
opt-level = 2

[profile.dev.package.solidcore-mesh]
opt-level = 2

[profile.dev.package.spiling-geometry]
opt-level = 2

[profile.dev.package.spiling-manufacturing]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
