[workspace]
resolver = "3"
members = ["crates/contracts", "crates/engine-client", "apps/engine", "apps/cli", "apps/desktop/src-tauri"]
default-members = ["crates/contracts", "crates/engine-client", "apps/engine", "apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "OSL-3.0"
repository = "https://github.com/pquerna/spiling"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["process", "io-util", "io-std", "net", "time", "sync", "rt-multi-thread", "macros"] }
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
prost = "=0.14.4"
prost-types = "=0.14.4"
tokio-stream = { version = "=0.1.19", features = ["net", "sync"] }
uuid = { version = "=1.27.0", features = ["v4"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }
spiling-contracts = { path = "crates/contracts" }
spiling-engine-client = { path = "crates/engine-client" }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
